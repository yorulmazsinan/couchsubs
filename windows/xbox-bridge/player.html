<!doctype html>
<html lang="en"><meta charset="utf-8"><title>CouchSubs Xbox reader</title>
<style>html,body,#stream{margin:0;width:100%;height:100%;background:#000}video{width:100%;height:100%}</style>
<div id="stream"></div>
<script src="player.js"></script>
<script>
// SPDX-License-Identifier: AGPL-3.0-only
(() => {
  const pending = new Map();
  let nextId = 0;
  let player;
  let playAudio = true;
  let audioObserver;
  let frameTimer = 0;
  let lastFrame = 0;
  // Varsayılan 66 ms kısa altyazıyı daha hızlı yakalar; Xbox ayarından #244 öncesindeki 200 ms'ye dönülebilir.
  // Uygulama önceki kareyi bitirmeden yenisi gönderilmez:
  // kareler ileti kuyruğunda birikip eski kare okunmasın (en çok FRAME_WAIT_MS beklenir, yanıt kaybolursa akış durmasın).
  let frameMs = 66;
  // Uygulamanın istediği kare aralığı (FrameCadence: en çok 10 kare/sn, işlemci doluysa ve okuma yavaşsa daha seyrek).
  let cadenceMs = 100;
  const FRAME_WAIT_MS = 1000;
  let frameSentAt = 0;
  let frameWaiting = false;
  // İlk kare (#403, #530): Xbox kare onayı alamazsa ~60 sn'de kapatır; onay requestVideoFrameCallback'te gider.
  // Uygulama ilk kare gelene kadar anahtar kare ister ve getStats tanısı sorar (XboxFirstFrameWatch).
  let frameCallbacks = 0;
  // Görüntü bekçisi (XboxPictureWatch): ilk kareden sonra saniyede bir yeni kare sayısı bildirilir; video öğesi
  // donunca aynı kare yeniden okumaya gönderilmez (eskiden donmuş görüntü okunmayı sürdürüyor, altyazı takılı kalıyordu).
  let pictureTimer = 0;
  let capturedCallbacks = -1;
  let firstFrameSent = false;
  let keyframeReadySent = false;
  // 'codec': anlaşılan görüntü kodeği tanı satırına girer (Xbox görüntü göndermeyince kodek mi, ayrılsın).
  const STAT_TYPES = ['inbound-rtp', 'candidate-pair', 'local-candidate', 'remote-candidate', 'transport', 'codec'];
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d', { willReadFrequently: true });
  // Kare yakalama (#1314): eskiden tam çözünürlükte drawImage + toDataURL('image/jpeg', 0.94) 100-333 ms'de bir ana iş
  // parçacığında yapılıyordu. Kare onayları da (xCloudPlayer Input.ts, 16 ms'lik setInterval) ana iş parçacığında
  // gider; JPEG kodlaması onları geciktirince Xbox görüntü kanalını kapatıyor, ses cızırdıyor, oturum yeniden
  // kuruluyordu. Şimdi kare createImageBitmap ile küçültülerek alınır, JPEG'e bir Worker'da (OffscreenCanvas) çevrilir
  // ve uygulamanın paylaşılan arabelleğine ikili yazılır (base64 yok). Worker ya da arabellek yoksa eski yol küçültülmüş
  // kareyle sürer.
  const MAX_FRAME_WIDTH = 1280;
  const JPEG_QUALITY = 0.8;
  const ENCODER_SOURCE = `
    let canvas, context;
    onmessage = async ({ data }) => {
      const started = performance.now();
      try {
        const bitmap = data.bitmap;
        if (!canvas || canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
          canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
          context = canvas.getContext('2d');
        }
        context.drawImage(bitmap, 0, 0);
        bitmap.close();
        const blob = await canvas.convertToBlob({ type: 'image/jpeg', quality: data.quality });
        const bytes = await blob.arrayBuffer();
        postMessage({ bytes, encodeMs: performance.now() - started }, [bytes]);
      } catch (error) {
        try { data.bitmap?.close(); } catch {}
        postMessage({ error: String(error?.message || error) });
      }
    };`;
  let encoder = null;
  let encoderBroken = false;
  // Uygulamanın gönderdiği paylaşılan arabellek (CoreWebView2SharedBuffer): JPEG baytları buraya yazılır.
  let frameBuffer = null;
  // 10 sn'lik tanı: ana iş parçacığında yakalamaya giden süre, Worker'da kodlama süresi, kare onayı aralıkları.
  const pipe = { frames: 0, mainMs: 0, mainMax: 0, encodeMs: 0, encodeMax: 0, binary: 0 };
  const acks = { last: 0, sends: 0, maxGap: 0, over: 0 };
  let pipeTimer = 0;
  function send(message) { window.chrome.webview.postMessage(message); }
  function makeEncoder() {
    if (encoder || encoderBroken) return encoder;
    try {
      if (typeof OffscreenCanvas === 'undefined' || typeof createImageBitmap !== 'function') throw new Error('OffscreenCanvas yok');
      encoder = new Worker(URL.createObjectURL(new Blob([ENCODER_SOURCE], { type: 'text/javascript' })));
      encoder.onmessage = ({ data }) => encoded(data);
      encoder.onerror = event => {
        log('kare kodlayıcı hatası: ' + (event.message || '?') + '; ana iş parçacığında küçültülmüş kodlamaya dönülüyor');
        encoderBroken = true;
        encoder?.terminate();
        encoder = null;
        frameWaiting = false;
      };
    } catch (error) {
      log('kare kodlayıcı kurulamadı: ' + (error?.message || error) + '; ana iş parçacığında küçültülmüş kodlama');
      encoderBroken = true;
      encoder = null;
    }
    return encoder;
  }
  function encoded(data) {
    if (!player) return;
    if (data.error) {
      log('kare kodlanamadı: ' + data.error);
      frameWaiting = false;
      return;
    }
    pipe.encodeMs += data.encodeMs;
    pipe.encodeMax = Math.max(pipe.encodeMax, data.encodeMs);
    deliver(new Uint8Array(data.bytes));
  }
  // JPEG baytları uygulamaya: paylaşılan arabellek varsa ikili (yalnız uzunluk iletilir), yoksa base64 (eski yol).
  function deliver(bytes) {
    if (frameBuffer && bytes.byteLength <= frameBuffer.byteLength) {
      new Uint8Array(frameBuffer).set(bytes);
      pipe.binary++;
      send({ kind: 'frameBinary', length: bytes.byteLength });
      return;
    }
    const reader = new FileReader();
    reader.onload = () => send({ kind: 'frame', image: reader.result });
    reader.onerror = () => { frameWaiting = false; };
    reader.readAsDataURL(new Blob([bytes], { type: 'image/jpeg' }));
  }
  // Kare onayları input kanalından gider (xCloudPlayer Channel/Base.ts send → RTCDataChannel.send); her gönderim anı
  // tutulur. Aralık uzarsa (ana iş parçacığı takıldı) Xbox görüntü kanalını kapatabilir.
  function watchAcks() {
    const input = player?.getDataChannel('input');
    if (!input || input.__couchsubsAcks) return;
    input.__couchsubsAcks = true;
    const original = input.send.bind(input);
    input.send = data => {
      const now = performance.now();
      if (acks.last) {
        const gap = now - acks.last;
        acks.maxGap = Math.max(acks.maxGap, gap);
        if (gap > 250) acks.over++;
      }
      acks.last = now;
      acks.sends++;
      return original(data);
    };
  }
  function ackSince() { return acks.last ? Math.round(performance.now() - acks.last) : -1; }
  function reportPipe() {
    if (!pipe.frames && !acks.sends) return;
    send({ kind: 'pipe', frames: pipe.frames, binary: pipe.binary,
      mainAvg: pipe.frames ? pipe.mainMs / pipe.frames : 0, mainMax: pipe.mainMax,
      encodeAvg: pipe.frames ? pipe.encodeMs / pipe.frames : 0, encodeMax: pipe.encodeMax,
      ackSends: acks.sends, ackMaxGap: acks.maxGap, ackOver: acks.over, worker: !!encoder });
    Object.assign(pipe, { frames: 0, mainMs: 0, mainMax: 0, encodeMs: 0, encodeMax: 0, binary: 0 });
    Object.assign(acks, { sends: 0, maxGap: 0, over: 0 });
  }
  function rpc(command, args) {
    const id = ++nextId;
    send({ kind: 'rpc', id, command, args });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function controlOpen() { return player?.getDataChannel('control')?.readyState === 'open'; }
  function notifyKeyframeReady() {
    if (keyframeReadySent || !controlOpen() || !document.querySelector('#stream video')) return;
    keyframeReadySent = true;
    send({ kind: 'keyframeReady' });
  }
  function watchFrames(video) {
    if (!video.requestVideoFrameCallback) return;
    const onFrame = (_, metadata) => {
      // Oynatıcı kapandı (stop): video öğesinin verdiği 2x2'lik boş kare ilk kare sayılmaz (#1432).
      if (!player) return;
      frameCallbacks++;
      if (!firstFrameSent) {
        firstFrameSent = true;
        send({ kind: 'firstFrame', width: metadata.width || video.videoWidth, height: metadata.height || video.videoHeight });
        pictureTimer = setInterval(() => send({ kind: 'picture', callbacks: frameCallbacks }), 1000);
      }
      video.requestVideoFrameCallback(onFrame);
    };
    video.requestVideoFrameCallback(onFrame);
  }
  async function sendStats() {
    const video = document.querySelector('#stream video');
    const stats = [];
    try {
      const report = await player?._webrtcClient?.getStats();
      report?.forEach(entry => { if (STAT_TYPES.includes(entry.type)) stats.push({ ...entry }); });
    } catch { /* Tanı alınamadıysa yalnız video durumu yazılır. */ }
    send({ kind: 'stats', stats, video: {
      readyState: video?.readyState ?? -1, width: video?.videoWidth ?? 0, height: video?.videoHeight ?? 0,
      visibility: document.visibilityState, callbacks: frameCallbacks,
    } });
  }
  function fail(error) { send({ kind: 'state', state: 'error', detail: String(error?.message || error) }); }
  // Yayını bitirmeyen sorunlar (oynatıcı kitaplığındaki yakalanmamış hata, video.play reddi) yalnız günlüğe yazılır.
  // Eskiden her biri fail() çağırıyor ve görüntü akarken oturum kapanıyordu.
  function log(text) { send({ kind: 'log', text: String(text?.message || text) }); }
  function play(video, retry = true) {
    video.play().catch(error => {
      log('video.play: ' + (error?.name || '') + ' ' + (error?.message || error));
      if (retry) setTimeout(() => play(video, false), 1000);
    });
  }
  function capture(video) {
    if (!video || !video.videoWidth || !video.videoHeight) return;
    const now = performance.now();
    if (now - lastFrame < Math.max(frameMs, cadenceMs)) return;
    if (frameWaiting && now - frameSentAt < FRAME_WAIT_MS) return;
    // Kare sayılabiliyorsa yalnız yeni kare okunur.
    if (firstFrameSent && frameCallbacks === capturedCallbacks) return;
    capturedCallbacks = frameCallbacks;
    lastFrame = now;
    frameSentAt = now;
    frameWaiting = true;
    // En çok 1280 piksel genişlik (PS5 Uzaktan Oynatma'nın 720p karesi gibi): yazı okunur kalır, kodlama ucuzlar.
    const scale = Math.min(1, MAX_FRAME_WIDTH / video.videoWidth);
    const width = Math.max(1, Math.round(video.videoWidth * scale));
    const height = Math.max(1, Math.round(video.videoHeight * scale));
    const worker = makeEncoder();
    if (worker) {
      // Küçültme tarayıcının kendi iş parçacığında; ana iş parçacığında yalnız istek kurulur.
      createImageBitmap(video, { resizeWidth: width, resizeHeight: height, resizeQuality: 'medium' })
        .then(bitmap => {
          if (!player || encoder !== worker) { bitmap.close(); frameWaiting = false; return; }
          worker.postMessage({ bitmap, quality: JPEG_QUALITY }, [bitmap]);
        })
        .catch(error => {
          log('kare alınamadı: ' + (error?.message || error));
          frameWaiting = false;
        });
    } else {
      canvas.width = width;
      canvas.height = height;
      context.drawImage(video, 0, 0, width, height);
      send({ kind: 'frame', image: canvas.toDataURL('image/jpeg', JPEG_QUALITY) });
    }
    const spent = performance.now() - now;
    pipe.frames++;
    pipe.mainMs += spent;
    pipe.mainMax = Math.max(pipe.mainMax, spent);
  }
  async function start() {
    if (player) return;
    player = new xCloudPlayer.default('stream', {
      ui_systemui: [], input_touch: false, input_mousekeyboard: false,
      input_legacykeyboard: false,
    });
    player.bind();
    player.setControllerRumble(false);
    watchAcks();
    pipeTimer = setInterval(reportPipe, 10000);
    player.getDataChannel('control')?.addEventListener('open', notifyKeyframeReady);
    // Veri kanallarının açılışı ve message kanalının el sıkışması günlüğe girer (telefonlardaki "kanal …" satırları gibi):
    // HandshakeAck gelmezse oynatıcı kontrol kanalında yetki isteğini göndermez, Xbox da görüntü göndermez.
    for (const name of ['input', 'control', 'message', 'chat']) {
      const channel = player.getDataChannel(name);
      channel?.addEventListener('open', () => log('kanal ' + name + ': open'));
      channel?.addEventListener('close', () => {
        if (name !== 'input') return log('kanal ' + name + ': closed');
        // Xbox görüntü kanalını kapattı: kare onayı o an gidiyor muydu (#1314, #1252).
        const since = ackSince();
        log('kanal input: closed; son kare onayı ' + (since < 0 ? 'gönderilmedi' : since + ' ms önce') +
          ', bu penceredeki en uzun onay aralığı ' + Math.round(acks.maxGap) + ' ms');
      });
    }
    // Xbox'ın metin iletileri (kapatma bildirimi gibi) telefonlardaki "kanal …" satırları gibi günlüğe girer; kapanmanın
    // nedeni Xbox'tan geliyorsa burada görünür.
    for (const name of ['message', 'control']) {
      player.getDataChannel(name)?.addEventListener('message', event => {
        if (typeof event.data !== 'string') return;
        log(event.data.includes('"HandshakeAck"') ? 'kanal message: HandshakeAck' : 'kanal ' + name + ': ' + event.data.slice(0, 300));
      });
    }
    // input kanalının ikili iletileri telefonlardaki gibi günlüğe girer (#1416): 16 = ServerMetadata baytlarıyla; 128
    // (titreşim) her an gelir, yazılmaz. Biçim uygulamada (XboxInputMessage), buradan yalnız ilk 32 bayt gider.
    player.getDataChannel('input')?.addEventListener('message', async event => {
      try {
        if (typeof event.data === 'string') return;
        const buffer = event.data instanceof ArrayBuffer ? event.data : await event.data?.arrayBuffer?.();
        if (!buffer || new Uint8Array(buffer, 0, Math.min(1, buffer.byteLength))[0] === 128) return;
        send({ kind: 'input', bytes: Array.from(new Uint8Array(buffer, 0, Math.min(32, buffer.byteLength))), length: buffer.byteLength });
      } catch { /* Yalnız tanı. */ }
    });
    // xCloudPlayer'ın 'connectionstate' olayı görüntü kanalının (input) durumudur; ICE ve WebRTC bağlantısının asıl
    // durumu ayrıca bildirilir (eskiden ICE kurulamazsa ya da koparsa Windows bunu hiç görmüyordu).
    const peer = player._webrtcClient;
    peer?.addEventListener('iceconnectionstatechange', () => send({ kind: 'ice', state: peer.iceConnectionState }));
    peer?.addEventListener('connectionstatechange', () => {
      if (peer.connectionState === 'failed') sendStats();
      send({ kind: 'peer', state: peer.connectionState });
    });
    player.setSdpHandler(async (_, offer) => {
      try {
        const answer = await rpc('chatSdp', { sdp: offer.sdp });
        player?.setRemoteOffer(answer.sdp);
      } catch (error) { fail(error); }
    });
    player.getEventBus().on('connectionstate', event => {
      // Bağlantı takıldığı ya da koptuğu anki ağ durumu günlüğe girsin.
      if (event.state === 'disconnected' || event.state === 'failed') sendStats();
      send({ kind: 'state', state: event.state });
      if (event.state === 'connected') {
        const applyAudioPreference = () => {
          const audio = player?._audioComponent?._audioRender;
          if (!audio) return false;
          audio.muted = !playAudio;
          return true;
        };
        if (!applyAudioPreference() && !audioObserver) {
          audioObserver = new MutationObserver(() => {
            if (!applyAudioPreference()) return;
            audioObserver?.disconnect();
            audioObserver = undefined;
          });
          audioObserver.observe(document.getElementById('stream'), { childList: true, subtree: true });
        }
        const attach = () => {
          const video = document.querySelector('#stream video');
          if (!video) return false;
          video.muted = true;
          watchFrames(video);
          notifyKeyframeReady();
          play(video);
          video.addEventListener('loadeddata', () => capture(video));
          frameTimer = setInterval(() => capture(video), frameMs);
          return true;
        };
        if (!attach()) {
          const observer = new MutationObserver(() => { if (attach()) observer.disconnect(); });
          observer.observe(document.getElementById('stream'), { childList: true, subtree: true });
        }
      }
    });
    try {
      const offer = await player.createOffer();
      const answer = await rpc('sdp', { sdp: offer.sdp });
      player.setRemoteOffer(answer.sdp);
      // Wait for local ICE gathering, including candidates on slower adapters.
      await Promise.race([
        new Promise(resolve => {
          if (player._webrtcClient.iceGatheringState === 'complete') return resolve();
          player._webrtcClient.addEventListener('icegatheringstatechange', () => {
            if (player?._webrtcClient?.iceGatheringState === 'complete') resolve();
          });
        }),
        new Promise(resolve => setTimeout(resolve, 5000)),
      ]);
      const candidates = player.getIceCandidates().map(candidate => ({
        candidate: candidate.candidate, sdpMLineIndex: candidate.sdpMLineIndex,
        sdpMid: candidate.sdpMid,
      }));
      player.setIceCandidates(await rpc('ice', { candidates }));
      // Uygulama bu andan bağlantının kurulma süresini sayar (XboxConnectWatch).
      send({ kind: 'negotiated' });
    } catch (error) { fail(error); }
  }
  // Uygulama oturumu kapatıyor: WebRTC bağlantısı ve veri kanalları düzgün kapatılır (Xbox kapanışı hemen görür),
  // kare kodlayıcı Worker'ı ve paylaşılan arabellek bırakılır. Uygulama WebView2'yi bundan kısa süre sonra atar.
  function stop() {
    if (player) log('oynatıcı kapatılıyor: WebRTC bağlantısı kapatılıyor');
    clearInterval(frameTimer);
    clearInterval(pictureTimer);
    clearInterval(pipeTimer);
    encoder?.terminate();
    encoder = null;
    frameBuffer = null;
    frameWaiting = false;
    audioObserver?.disconnect();
    audioObserver = undefined;
    for (const item of pending.values()) item.reject(new Error('Xbox stream stopped'));
    pending.clear();
    player?.close();
    player = undefined;
  }
  window.chrome.webview.addEventListener('message', event => {
    const message = event.data;
    if (message.kind === 'reply') {
      const item = pending.get(message.id);
      if (!item) return;
      pending.delete(message.id);
      if (message.error) item.reject(new Error(message.error)); else item.resolve(message.value);
    } else if (message.kind === 'frameDone') {
      frameWaiting = false;
      if (Number.isFinite(message.nextMs)) cadenceMs = Math.min(Math.max(message.nextMs, 0), 1000);
    }
    else if (message.kind === 'keyframe') {
      if (controlOpen()) player.getChannelProcessor('control')?.requestKeyframeRequest();
    }
    else if (message.kind === 'stats') sendStats();
    else if (message.kind === 'start') {
      frameMs = message.legacyFrameRate ? 200 : 66;
      playAudio = message.playAudio !== false;
      start().catch(fail);
    }
    else if (message.kind === 'audio') {
      // Çeviri sürerken ses ayarı değişti: yalnız ses öğesi açılır/kısılır, oturum yeniden kurulmaz (#871).
      playAudio = message.playAudio !== false;
      const audio = player?._audioComponent?._audioRender;
      if (audio) {
        audio.muted = !playAudio;
        if (playAudio && audio.paused) audio.play().catch(error => log('ses çalınamadı: ' + error));
      }
    }
    else if (message.kind === 'stop') stop();
  });
  // Uygulama kare baytları için paylaşılan arabellek gönderir (CoreWebView2SharedBuffer); gelmezse base64 yolu sürer.
  window.chrome.webview.addEventListener('sharedbufferreceived', event => {
    if (event.additionalData?.kind === 'frameBuffer') frameBuffer = event.getBuffer();
  });
  window.addEventListener('error', event => log('hata: ' + (event.error?.stack || event.error || event.message)));
  window.addEventListener('unhandledrejection', event => log('yakalanmamış söz: ' + (event.reason?.stack || event.reason)));
})();
</script></html>
