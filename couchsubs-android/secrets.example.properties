# Bu dosyayı secrets.properties adıyla kopyalayıp doldurun (secrets.properties depoya girmez). CI'da aynı adlar ortam
# değişkeni olarak da verilebilir: PACKS_URL, FACEBOOK_APPID, FACEBOOK_CLIENTTOKEN, ADMOB_APPID, ADMOB_BANNERID.
# Boş bırakılan alan: ilgili özellik kapalı kalır (packs.url yoksa paketler yalnız uygulamayla gelenlerdir).

# server/packs Worker'ının adresi, ör. https://couchsubs-packs.<hesap>.workers.dev
packs.url=
# Meta for Developers › uygulama › Ayarlar › Temel: Uygulama Kimliği ve Gelişmiş › İstemci tokeni
facebook.appId=
facebook.clientToken=
# AdMob › Uygulamalar › Uygulama kimliği (ca-app-pub-…~…) ve banner reklam birimi (ca-app-pub-…/…).
# Boşsa Google'ın deneme kimlikleri kullanılır; reklam zaten Remote Config "ads_enabled" açılmadan gösterilmez.
admob.appId=
admob.bannerId=
