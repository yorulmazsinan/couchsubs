plugins { id 'com.android.application' }

// İmza anahtarları ortam değişkenlerinden gelir (CI'da depo sırları, bkz. .github/workflows/tv-android.yml); hiçbiri depoda
// durmaz. Yoksa geliştirme anahtarıyla imzalanır.
//   ANDROID_KEYSTORE_FILE / ANDROID_KEYSTORE_PASSWORD: sürüm anahtarı (takma ad couchsubs). Masaüstü uygulamalarının ADB ile
//     kurduğu APK bununla imzalanır.
//   ANDROID_UPLOAD_KEYSTORE_FILE / ANDROID_UPLOAD_KEYSTORE_PASSWORD / ANDROID_UPLOAD_KEY_ALIAS: Google Play yükleme anahtarı
//     (isteğe bağlı). Yoksa Play paketi (AAB) de sürüm anahtarıyla imzalanır. Bkz. docs/play-store-tv.md.
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def uploadKeystore = System.getenv('ANDROID_UPLOAD_KEYSTORE_FILE')

android {
    namespace 'com.couchsubs.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.couchsubs.tv'
        minSdk 24
        targetSdk 35
        // Masaüstü uygulamaları beklenen TV sürümünü buradan alır (scripts/bundle-android-apk.sh, APK adı).
        versionCode 20
        versionName '0.9.17'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'couchsubs'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
        upload {
            if (uploadKeystore) {
                storeFile file(uploadKeystore)
                storePassword System.getenv('ANDROID_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('ANDROID_UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }
    // İki dağıtım: masaüstünün ADB ile kurduğu APK (katman modu var) ve Google Play paketi (katman modu yok: Play'in TV
    // kalite kuralı TV-TR uygulamanın başka uygulamaların üstünü örtmesine izin vermiyor). Bkz. docs/play-store-tv.md.
    flavorDimensions = ['distribution']
    productFlavors {
        sideload {
            dimension 'distribution'
            buildConfigField 'boolean', 'OVERLAY_MODE', 'true'
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        play {
            dimension 'distribution'
            buildConfigField 'boolean', 'OVERLAY_MODE', 'false'
            signingConfig uploadKeystore ? signingConfigs.upload : (releaseKeystore ? signingConfigs.release : signingConfigs.debug)
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('generated/tv-assets')
}

// Arayüz LG ve Samsung'la ortaktır.
tasks.register('copyTvAssets', Copy) {
    into layout.buildDirectory.dir('generated/tv-assets/tv')
    from('../../tv-webos') { include 'app.js', 'i18n.js', 'config.js', 'index.html', 'style.css', 'icon.png', 'largeIcon.png' }
    from('..') { include 'platform.js' }
}
preBuild.dependsOn 'copyTvAssets'

// Görüntü modu kararları (DisplayMode, FallbackWatch) JVM'de denenir: src/test. Dağıtıma özgü denetimler src/testPlay ve
// src/testSideload'dadır.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
