# SPDX-License-Identifier: AGPL-3.0-only
# Dış PR'lar için yalnız test: native derleme, model indirme, paketleme ve imza yok.
name: pr-tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Yalnız ilgili klasör değişince pahalı (özellikle macOS) işler çalışsın. Elle çalıştırmada hepsi çalışır.
  changes:
    name: Değişen yollar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      swift: ${{ steps.filter.outputs.swift }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          printf '%s\n' "$files"
          match() { if grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi; }
          wf='^\.github/workflows/pr-tests\.yml$'
          res='^core/Sources/CouchSubsCore/Resources/'
          echo "windows=$(match "^windows/|${res}|${wf}")" >> "$GITHUB_OUTPUT"
          echo "swift=$(match "^core/|${wf}")" >> "$GITHUB_OUTPUT"
          echo "android=$(match "^couchsubs-android/|^tv-webos/|^tv-tizen/|${res}|${wf}")" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows / .NET
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      COUCHSUBS_DOWNLOAD_TEST_MODELS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Çözümün tamamı App/native/paketleme bağımlılıklarını getirir; yalnız test projelerini derle.
      # Zamanlama testleri CPU paylaşımından etkilenmesin diye projeler sırayla çalışır.
      - name: .NET testleri
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = $false
          $projects = @(Get-ChildItem windows/tests/*/*.csproj)
          if ($projects.Count -eq 0) { throw 'Test projesi bulunamadı.' }
          foreach ($project in $projects) {
            dotnet test $project.FullName --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=$($project.BaseName).trx" --results-directory "$env:RUNNER_TEMP/test-results"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pr-windows-test-results
          path: ${{ runner.temp }}/test-results/*.trx
          if-no-files-found: error
          retention-days: 7

  swift:
    name: macOS / Swift core
    needs: changes
    if: ${{ needs.changes.outputs.swift == 'true' }}
    # Package.swift: Swift 6.2; projenin mevcut macOS iş akışıyla aynı runner.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift testleri
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-results"
          swift --version
          # XCTest'in sıralı çalışmasında xUnit çıktısı Swift sürümüne göre eksik olabilir.
          # Ham test kaydı, XCTSkip gerekçelerini ve toplamları da korur.
          swift test 2>&1 | tee "$RUNNER_TEMP/test-results/swift.log"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pr-swift-test-results
          path: ${{ runner.temp }}/test-results/swift.log
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android / JVM
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-read-only: true
      - name: TV keşif ve eşleştirme testleri
        run: node --test scripts/tv-discovery.test.js
      - name: JVM testleri
        working-directory: couchsubs-android
        shell: bash
        run: |
          # preBuild varsayılan olarak Samsung paketi üretir ve APK/IPK indirir.
          # Bunları atla; eksik TV paketi testi JUnit assumption ile açıkça SKIPPED olur.
          gradle :app:testDebugUnitTest \
            -Pcouchsubs.skipNative=true -Pcouchsubs.requireTvPackages=false \
            -x :app:samsungTvPackage -x :app:tvReleasePackages \
            --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pr-android-test-results
          path: |
            couchsubs-android/app/build/test-results/testDebugUnitTest/*.xml
            couchsubs-android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7
