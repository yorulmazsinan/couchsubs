# SPDX-License-Identifier: AGPL-3.0-only
# Android TV uygulaması. İki çıktı:
#   - CouchSubs-androidtv.apk (sideload): masaüstü uygulamalarına gömülür, ADB ile kurulur; katman modu vardır.
#   - CouchSubs-androidtv-play.aab (play): Google Play'e elle yüklenir; katman modu yoktur (docs/play-store-tv.md).
# İmza şu depo sırlarından yapılır (adlar TV'ye özel; telefon uygulamasının anahtarı ayrıdır):
#   TV_KEYSTORE_BASE64, TV_KEYSTORE_PASSWORD, TV_KEY_ALIAS: TV sürüm anahtarı (APK ve AAB; Play'in uygulama imza anahtarı)
#   TV_UPLOAD_KEYSTORE_BASE64, TV_UPLOAD_KEYSTORE_PASSWORD, TV_UPLOAD_KEY_ALIAS: ayrı Play yükleme anahtarı (isteğe bağlı)
# Sürüm derlemesinde (release.yml, require-signing) sürüm anahtarı yoksa iş hata verir; geliştirme anahtarına düşmez.
name: tv-android

on:
  push:
    branches: [main, "feat/windows-*"]
    paths: ["tv-android/**", "tv-webos/**", "scripts/tv-discovery.test.js", "scripts/tv-android-overlay.test.js", "scripts/tv-android-background.test.js", ".github/workflows/tv-android.yml"]
  workflow_dispatch:
  # Sürüm iş akışı (release.yml) paketi buradan alır.
  workflow_call:
    inputs:
      require-signing:
        description: Sürüm anahtarı yoksa geliştirme anahtarıyla imzalamak yerine hata ver
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      # TV sayfasının ortak kodu (tv-webos): altyazı kaynağını ağda bulma.
      - name: TV sayfası testleri
        run: node --test scripts/tv-discovery.test.js
      # Android'e özgü sayfa kodu (platform.js): katmanda durum işareti yok, bağlantı Android'e bildirilir.
      - name: Android TV sayfası testleri
        run: node --test scripts/tv-android-overlay.test.js scripts/tv-android-background.test.js
      - name: İmza anahtarı
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.TV_UPLOAD_KEYSTORE_BASE64 }}
          REQUIRE_SIGNING: ${{ inputs.require-signing && 'true' || 'false' }}
        run: |
          if [ -n "$TV_KEYSTORE_BASE64" ] && [ -n "$TV_KEYSTORE_PASSWORD" ]; then
            echo "$TV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "TV_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [ "$REQUIRE_SIGNING" = "true" ]; then
            echo "::error::TV_KEYSTORE_BASE64 / TV_KEYSTORE_PASSWORD sırları yok; sürüm paketi geliştirme anahtarıyla imzalanmaz."
            exit 1
          fi
          if [ -n "$TV_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$TV_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
            echo "TV_UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          fi
      - name: Derle
        env:
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.TV_UPLOAD_KEYSTORE_PASSWORD }}
          TV_UPLOAD_KEY_ALIAS: ${{ secrets.TV_UPLOAD_KEY_ALIAS }}
        working-directory: tv-android
        run: |
          gradle testSideloadReleaseUnitTest testPlayReleaseUnitTest assembleSideloadRelease bundlePlayRelease --no-daemon
          mkdir -p ../dist ../dist-play
          cp app/build/outputs/apk/sideload/release/*.apk ../dist/CouchSubs-androidtv.apk
          cp app/build/outputs/bundle/playRelease/*.aab ../dist-play/CouchSubs-androidtv-play.aab
      # Masaüstü paketleri bu yapıttaki tek APK'yı alır (release.yml, windows.yml); AAB ayrı yapıttadır.
      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-android
          path: dist/*.apk
          if-no-files-found: error
      # Google Play'e Play Console'dan elle yüklenir; GitHub sürümüne konmaz.
      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-android-play
          path: dist-play/*.aab
          if-no-files-found: error
