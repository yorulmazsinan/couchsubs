name: tv-screen-tests
on:
  pull_request:
    paths: ['tv-webos/app.js', 'tv-webos/style.css', 'scripts/tv-screen.test.js', 'scripts/tv-cover.test.js', 'tv-tizen/platform.js', 'tv-tizen/config.xml', 'scripts/tv-tizen.test.js', 'scripts/tv-tizen-screen.test.js', 'scripts/package-tizen.sh', 'tv-webos/index.html', 'core/Sources/CouchSubsCore/Resources/obs-overlay.html', 'scripts/obs-overlay.test.js', 'scripts/tv-subtitle-box.test.js', '.github/workflows/tv-screen-tests.yml']
  push:
    branches: [main]
    paths: ['tv-webos/app.js', 'tv-webos/style.css', 'scripts/tv-screen.test.js', 'scripts/tv-cover.test.js', 'tv-tizen/platform.js', 'tv-tizen/config.xml', 'scripts/tv-tizen.test.js', 'scripts/tv-tizen-screen.test.js', 'scripts/package-tizen.sh', 'tv-webos/index.html', 'core/Sources/CouchSubsCore/Resources/obs-overlay.html', 'scripts/obs-overlay.test.js', 'scripts/tv-subtitle-box.test.js', '.github/workflows/tv-screen-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    name: TV ekran yerleşimi / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tarayıcıyı doğrula
        run: echo "COUCHSUBS_TEST_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Gerçek çizim testleri
        run: node --test scripts/tv-screen.test.js
      - name: Örtü yeri testleri (Android TV katmanı)
        run: node --test scripts/tv-cover.test.js
      - name: Samsung ultrawide görünüm testleri
        run: node --test scripts/tv-tizen.test.js
      - name: Samsung paketi ultrawide çizim testleri
        run: node --test scripts/tv-tizen-screen.test.js
      - name: OBS katmanı yerleşim testleri
        run: node --test scripts/obs-overlay.test.js
      - name: Altyazı kutusu yazıya oturur (TV)
        run: node --test scripts/tv-subtitle-box.test.js
