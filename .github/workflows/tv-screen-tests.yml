name: tv-screen-tests
on:
  pull_request:
    paths: ['tv-webos/app.js', 'tv-webos/style.css', 'scripts/tv-screen.test.js', 'scripts/tv-cover.test.js', 'scripts/tv-cover-pixels.test.js', 'tv-tizen/platform.js', 'tv-tizen/config.xml', 'scripts/tv-tizen.test.js', 'scripts/tv-tizen-screen.test.js', 'scripts/package-tizen.sh', 'tv-webos/index.html', 'core/Sources/CouchSubsCore/Resources/obs-overlay.html', 'scripts/obs-overlay.test.js', 'scripts/tv-subtitle-box.test.js', 'scripts/tv-speakers.test.js', 'tv-webos/platform.js', 'scripts/tv-webos-hdmi.test.js', 'scripts/tv-webos-screensaver.test.js', 'scripts/tv-webos-stale-reload.test.js', 'scripts/tv-webos-screen.test.js', 'scripts/tv-webos-zoom.test.js', 'tv-webos/appinfo.json', 'scripts/tv-screen-text-apart.test.js', 'scripts/tv-no-overlap.test.js', 'scripts/tv-screen-layers.test.js', 'scripts/tv-overlay-brightness.test.js', 'tv-webos/i18n.js', 'tv-webos/config.js', 'tv-android/platform.js', 'scripts/tv-es5.test.js', 'scripts/tv-screen-notice.test.js', 'scripts/tv-live-page.js', 'scripts/tv-live-stale.test.js', 'scripts/tv-event-log.test.js', 'scripts/tv-legacy-app.test.js', 'scripts/tv-hdmi-reselect.test.js', 'scripts/tv-screen-fit.test.js', 'scripts/tv-exact-fit.test.js', 'scripts/tv-exact-modes.test.js', 'scripts/tv-short-dialogue.test.js', 'scripts/tv-overlay-subtitle-size.test.js', 'scripts/tv-phone-bubbles.test.js', 'core/Tests/CouchSubsCoreTests/Fixtures/text-paint.json', 'scripts/tv-solid-background.test.js', 'testdata/frames/ocr/screen-fit-items.json', '.github/workflows/tv-screen-tests.yml']
  push:
    branches: [main]
    paths: ['tv-webos/app.js', 'tv-webos/style.css', 'scripts/tv-screen.test.js', 'scripts/tv-cover.test.js', 'scripts/tv-cover-pixels.test.js', 'tv-tizen/platform.js', 'tv-tizen/config.xml', 'scripts/tv-tizen.test.js', 'scripts/tv-tizen-screen.test.js', 'scripts/package-tizen.sh', 'tv-webos/index.html', 'core/Sources/CouchSubsCore/Resources/obs-overlay.html', 'scripts/obs-overlay.test.js', 'scripts/tv-subtitle-box.test.js', 'scripts/tv-speakers.test.js', 'tv-webos/platform.js', 'scripts/tv-webos-hdmi.test.js', 'scripts/tv-webos-screensaver.test.js', 'scripts/tv-webos-stale-reload.test.js', 'scripts/tv-webos-screen.test.js', 'scripts/tv-webos-zoom.test.js', 'tv-webos/appinfo.json', 'scripts/tv-screen-text-apart.test.js', 'scripts/tv-no-overlap.test.js', 'scripts/tv-screen-layers.test.js', 'scripts/tv-overlay-brightness.test.js', 'tv-webos/i18n.js', 'tv-webos/config.js', 'tv-android/platform.js', 'scripts/tv-es5.test.js', 'scripts/tv-screen-notice.test.js', 'scripts/tv-live-page.js', 'scripts/tv-live-stale.test.js', 'scripts/tv-event-log.test.js', 'scripts/tv-legacy-app.test.js', 'scripts/tv-hdmi-reselect.test.js', 'scripts/tv-screen-fit.test.js', 'scripts/tv-exact-fit.test.js', 'scripts/tv-exact-modes.test.js', 'scripts/tv-short-dialogue.test.js', 'scripts/tv-overlay-subtitle-size.test.js', 'scripts/tv-phone-bubbles.test.js', 'core/Tests/CouchSubsCoreTests/Fixtures/text-paint.json', 'scripts/tv-solid-background.test.js', 'testdata/frames/ocr/screen-fit-items.json', '.github/workflows/tv-screen-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    name: TV ekran yerleşimi / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Eski TV uygulaması testi eski sürümleri git geçmişinden çıkarır.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tarayıcıyı doğrula
        run: echo "COUCHSUBS_TEST_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: ES5 ayrıştırıcısını kur (acorn)
        run: npm install --no-save --prefix "$RUNNER_TEMP/acorn" acorn@8.14.0 && echo "COUCHSUBS_ACORN=$RUNNER_TEMP/acorn/node_modules/acorn" >> "$GITHUB_ENV"
      - name: TV betikleri ES5 (Tizen 2.3-2.4, #761)
        run: node --test scripts/tv-es5.test.js
      - name: Android TV sayfası gerçek ağla, Android 8 WebView kısıtlarıyla (eski adrese bağlı kalma, sub 0)
        run: node --test scripts/tv-live-stale.test.js
      - name: TV olay günlüğü (HDMI yeniden kurma, sayfa yenileme, yeniden açılma) bilgisayara seyreltilmiş gider
        run: node --test --test-force-exit scripts/tv-event-log.test.js
      - name: Bilgisayarın bildirdiği giriş zaten açıksa görüntü yeniden kurulmaz (#1055)
        run: node --test --test-force-exit scripts/tv-hdmi-reselect.test.js
      - name: Eski TV uygulaması (0.9.3, 0.9.16, 0.9.33) bugünkü olaylarla; eski TV'ye clear tutularak gider
        run: node --test scripts/tv-legacy-app.test.js
      - name: Gerçek çizim testleri
        run: node --test scripts/tv-screen.test.js
      - name: Ekranı çevir gerçek GTA 6 karelerinde özgün yazının yerinde ve boyunda; simge örtülmez (720p, 1080p, 4K)
        run: node --test scripts/tv-screen-fit.test.js
      - name: Yerinde birebir çizim (opak köşesiz kutu, degrade, tek boy grup, boş alana uzama; ortak vakalar, OBS aynı)
        run: node --test scripts/tv-exact-fit.test.js
      - name: Çizim kipleri (yanına yazma kutusuz ve solda, ikiz küçük panel üstte, eski gönderi örtme)
        run: node --test scripts/tv-exact-modes.test.js
      - name: Kısa konuşma satırı dar ve basık çizilmez; Android TV'de dar aile yok (#1255)
        run: node --test scripts/tv-short-dialogue.test.js
      - name: GTA 6 telefonu; hizalı panel (720p/1080p/4K, dpr 1/2/3), eski TV akışla çizer
        run: node --test scripts/tv-phone-bubbles.test.js
      - name: Konuşma satırı hiçbir çözünürlük, dpr, yazı ölçeği ve modda basık, dar, küçük değil; Katman = Uygulama içinde (#1255, #1259)
        run: node --test scripts/tv-overlay-subtitle-size.test.js
      - name: Örtü yeri testleri (Android TV katmanı)
        run: node --test scripts/tv-cover.test.js
      - name: Örtü İngilizce altyazıyı tamamen kapatır, yazı boyu sabit (TV ve OBS, piksel ölçümü)
        run: node --test scripts/tv-cover-pixels.test.js
      - name: Samsung ultrawide görünüm testleri
        run: node --test scripts/tv-tizen.test.js
      - name: Samsung paketi ultrawide çizim testleri
        run: node --test scripts/tv-tizen-screen.test.js
      - name: OBS katmanı yerleşim testleri
        run: node --test scripts/obs-overlay.test.js
      - name: Altyazı kutusu yazıya oturur (TV)
        run: node --test scripts/tv-subtitle-box.test.js
      - name: Koyu zeminde bütün kutular (önceki satırlar dahil) tam opak saf siyah (TV)
        run: node --test scripts/tv-solid-background.test.js
      - name: Konuşan adını renklendir testleri (TV ve OBS)
        run: node --test scripts/tv-speakers.test.js
      - name: LG HDMI görüntü gözcüsü ve ekran koruyucu testleri
        run: node --test scripts/tv-webos-hdmi.test.js scripts/tv-webos-screensaver.test.js scripts/tv-webos-stale-reload.test.js scripts/tv-webos-screen.test.js scripts/tv-webos-zoom.test.js
      - name: Ekran yazısı ile altyazı üst üste binmez (TV)
        run: node --test scripts/tv-screen-text-apart.test.js
      - name: Hiçbir iki çeviri kutusu üst üste binmez; aynı anda konuşanlar, önceki satırlar, görev ve ekran yazısı (TV)
        run: node --test scripts/tv-no-overlap.test.js
      - name: Aynı yeri çizen katmanlardan yalnız biri görünür; görev satırı ekran yazısının altında kalmaz (TV)
        run: node --test scripts/tv-screen-layers.test.js
      - name: PS5 görüntüsünün üstünde kalıcı karartı yok (TV, piksel ölçümü)
        run: node --test scripts/tv-overlay-brightness.test.js
      - name: Kenar bildirimi kendi yerinde, ortaya çizilmez (TV ve OBS, piksel ölçümü)
        run: node --test scripts/tv-screen-notice.test.js
