# SPDX-License-Identifier: AGPL-3.0-only
# Windows uygulaması: yerel DLL'i (libchiaki + FFmpeg) MSYS2 ile derler, .NET testlerini koşar,
# uygulamayı tek klasör olarak yayınlar.
name: windows

on:
  push:
    branches: [main, "feat/windows-*"]
  workflow_dispatch:
  # Sürüm iş akışı (release.yml) Windows paketini buradan alır.
  workflow_call:
    inputs:
      with-android:
        description: Android TV APK'sı (tv-android iş akışının çıktısı) uygulamaya gömülsün
        type: boolean
        default: false

env:
  FFMPEG_VERSION: "7.1.2"

jobs:
  native:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Satır sonları olduğu gibi kalsın
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: chiaki-ng ve gereken alt modüller
        shell: pwsh
        run: |
          git submodule update --init --depth 1 third-party/chiaki-ng
          git -C third-party/chiaki-ng submodule update --init --depth 1 third-party/nanopb third-party/jerasure third-party/gf-complete third-party/curl
          git -C third-party/chiaki-ng apply ../patches/chiaki-takion-send-after-close.patch

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: make diffutils tar xz
          pacboy: >-
            cc:p
            cmake:p
            ninja:p
            pkgconf:p
            nasm:p
            python:p
            python-protobuf:p
            protobuf:p
            openssl:p
            json-c:p
            libevent:p
            miniupnpc:p

      - name: FFmpeg önbelleği
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-prefix
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-mingw64-h264-swscale-v1

      # LGPL, yalnız h264 çözücü + ayrıştırıcı ve swscale; statik.
      - name: FFmpeg (kaynaktan, en küçük yapılandırma)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          PREFIX="$PWD/ffmpeg-prefix"
          mkdir -p ffmpeg-src
          # ffmpeg.org zaman zaman bağlantıyı kesiyor; yeniden dene, olmazsa GitHub'daki aynı etiketi al.
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"; then
            tar -xJf ffmpeg.tar.xz -C ffmpeg-src --strip-components=1
          else
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o ffmpeg.tar.gz "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FFMPEG_VERSION}.tar.gz"
            tar -xzf ffmpeg.tar.gz -C ffmpeg-src --strip-components=1
          fi
          cd ffmpeg-src
          ./configure --prefix="$PREFIX" \
            --enable-static --disable-shared --disable-debug \
            --disable-everything --disable-autodetect --enable-w32threads \
            --disable-programs --disable-doc --disable-network \
            --disable-avdevice --disable-avformat --disable-avfilter --disable-swresample \
            --enable-avcodec --enable-avutil --enable-swscale \
            --enable-decoder=h264 --enable-parser=h264
          make -j"$(nproc)"
          make install

      # Sonraki adımlar başarısız olsa da derlenen FFmpeg saklansın.
      - name: FFmpeg'i önbelleğe yaz
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg-prefix
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Statik bağımlılıklar mevcut mu
        run: ls -l /mingw64/lib/libcrypto.a /mingw64/lib/libjson-c.a /mingw64/lib/libevent.a /mingw64/lib/libminiupnpc.a ffmpeg-prefix/lib/*.a

      - name: Yapılandır
        run: cmake -S windows/native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_PREFIX="$PWD/ffmpeg-prefix"

      - name: Derle
        run: cmake --build build/native

      - name: Yerel testler
        run: build/native/couchsubs_native_test.exe remoteplay/Tests/RemotePlayTests/Fixtures/sample-1080p.h264

      - name: DLL yalnız Windows'un kendi DLL'lerine bağlı olmalı
        run: |
          DLL=build/native/couchsubs_native.dll
          objdump -p "$DLL" | grep 'DLL Name' | tee deps.txt
          allowed='^(kernel32|user32|advapi32|shell32|ole32|oleaut32|gdi32|ws2_32|wsock32|iphlpapi|bcrypt|bcryptprimitives|crypt32|secur32|normaliz|msvcrt|ntdll|api-ms-win-.*|ucrtbase)\.dll$'
          bad=$(awk '{print tolower($3)}' deps.txt | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "İzin verilmeyen bağımlılık: $bad"; exit 1; fi
          for fn in cs_init cs_discover cs_wake cs_register cs_session_start cs_session_stop; do
            objdump -p "$DLL" | grep -qw "$fn" || { echo "Dışa aktarılmamış: $fn"; exit 1; }
          done
          ls -l "$DLL"

      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-native
          path: build/native/couchsubs_native.dll
          if-no-files-found: error

  dotnet:
    runs-on: windows-latest
    needs: native
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: couchsubs-native
          path: windows/native/bin

      - name: Derle
        run: dotnet build windows/CouchSubs.Windows.slnx -c Release

      # Zamanlamaya bakan testler var; test projeleri aynı anda koşup işlemciyi paylaşmasın.
      - name: Testler
        run: dotnet test windows/CouchSubs.Windows.slnx -c Release --no-build -m:1

      - uses: actions/download-artifact@v4
        if: inputs.with-android
        with:
          name: couchsubs-android
          path: android-apk

      - name: TV paketleri
        shell: bash
        run: |
          npm install -g @webos-tools/cli
          ./scripts/package-tv.sh
          ./scripts/package-tizen.sh
          if [ -d android-apk ]; then ./scripts/bundle-android-apk.sh "$(ls android-apk/*.apk | head -1)"; fi

      # Sürüm etiketten gelir (v0.1.0-beta.10 → 0.1.0-beta.10); uygulama içi güncelleme bununla karşılaştırır.
      - name: Yayınla
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.1.0-dev; fi
          dotnet publish windows/src/CouchSubs.App -c Release -r win-x64 --self-contained -o publish/CouchSubs -p:Version="$VERSION"

      # Ücretsiz çeviri motoru (ONNX Runtime) Visual C++ çalışma zamanına bağlı: onnxruntime.dll VCRUNTIME140(_1).dll ve
      # MSVCP140(_1).dll ister. Bunlar Windows'la gelmez; Visual C++ paketi kurulu olmayan bilgisayarda onnxruntime.dll
      # yüklenemiyor, ücretsiz çeviri hiç çalışmıyordu (DllNotFoundException 0x8007007E). Microsoft'un belgelediği uygulama
      # yanı dağıtımla Visual Studio'nun redist klasöründeki DLL'ler exe'nin yanına konur; .exe klasörü DLL aramasında
      # System32'den önce gelir, Windows'taki eski bir msvcp140.dll de (ORT'yi çökertir) kullanılmaz. Kurulum dosyası ve zip
      # ikisi de bu klasörden çıkar; kurulumda yönetici izni istenmez.
      - name: Visual C++ çalışma zamanı (uygulamanın yanına)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ araçları bulunamadı" }
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Where-Object { $_.Parent.Parent.Name -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ redist klasörü (Microsoft.VC14x.CRT) bulunamadı" }
          Write-Host "Kaynak: $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" publish/CouchSubs/
          Get-ChildItem $crt.FullName -Filter *.dll | ForEach-Object { "{0,-28} {1}" -f $_.Name, $_.VersionInfo.FileVersion }

      # Türkçe dublajın ses motoru (Kyutai pocket-tts, MIT): sabit sürüm, özeti denetlenir.
      - name: Dublaj ses motoru
        shell: bash
        run: ./scripts/fetch-pocket-tts.sh windows publish/CouchSubs/tts

      # Kurulum dosyası ve zip bu klasörden çıkar: ONNX Runtime DLL'leri ve her yerel DLL/exe'nin istediği Visual C++
      # DLL'leri yanında değilse derleme durur. Bağımlılıklar dumpbin ile dosyaların kendi içe aktarma tablosundan okunur.
      - name: ONNX Runtime ve Visual C++ DLL'leri yayın klasöründe mi
        shell: pwsh
        run: |
          $dir = Resolve-Path publish/CouchSubs
          foreach ($f in "onnxruntime.dll", "onnxruntime_providers_shared.dll", "Microsoft.ML.OnnxRuntime.dll",
                         "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f yayın klasöründe yok" }
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          if (-not $dumpbin) { throw "dumpbin bulunamadı" }
          $vcRuntime = '^(vcruntime|msvcp|concrt|vccorlib|vcomp)\d+.*\.dll$'
          $deps = { param($file) & $dumpbin.FullName /nologo /dependents $file | ForEach-Object { $_.Trim() } | Where-Object { $_ -match $vcRuntime } }
          # Okuma bozulursa denetim boşa geçmesin: onnxruntime.dll'in bilinen bağımlılıkları görünmeli.
          $ort = @(& $deps (Join-Path $dir onnxruntime.dll))
          Write-Host "onnxruntime.dll Visual C++ bağımlılıkları: $($ort -join ', ')"
          if ($ort -notcontains "VCRUNTIME140.dll" -or $ort -notcontains "MSVCP140.dll") { throw "onnxruntime.dll bağımlılıkları okunamadı" }
          $missing = foreach ($bin in Get-ChildItem $dir -Recurse -Include *.dll, *.exe) {
            foreach ($dep in & $deps $bin.FullName) {
              if (-not (Test-Path (Join-Path $bin.DirectoryName $dep))) { "$($bin.FullName.Substring($dir.Path.Length + 1)) -> $dep" }
            }
          }
          if ($missing) { $missing; throw "Visual C++ DLL'leri eksik" }
          # ORT 1.19 ve sonrası eski msvcp140.dll ile std::mutex'te çöküyor; Microsoft 14.40 ve üstünü istiyor.
          $v = (Get-Item (Join-Path $dir msvcp140.dll)).VersionInfo
          if ([version]::new($v.FileMajorPart, $v.FileMinorPart) -lt [version]"14.40") { throw "msvcp140.dll eski: $($v.FileVersion)" }
          Write-Host "Tamam: msvcp140.dll $($v.FileVersion)"

      # Kurulum dosyası ve uygulama içi güncelleme paketleri (Velopack, MIT). Sürümde önceki sürüm indirilir; yalnız
      # değişen parçalar (delta) da üretilir. Her derlemede denenir ki paketleme hatası sürüm anında çıkmasın.
      - name: Kurulum dosyası
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0-dev" }
          Copy-Item -Recurse publish/CouchSubs pack
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md pack/
          dotnet tool install -g vpk --version 1.2.161
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            vpk download github --repoUrl https://github.com/yorulmazsinan/couchsubs -o Releases
            if ($LASTEXITCODE -ne 0) { Write-Host "Önceki Velopack sürümü yok; yalnız tam paket üretilecek." }
          }
          # --framework webview2: PlayStation giriş penceresi WebView2 ister; eksik bilgisayarlarda kurulum onu da kurar.
          vpk pack --packId CouchSubsApp --packVersion $version --packDir pack --mainExe CouchSubs.exe --framework webview2 `
            --packTitle CouchSubs --packAuthors Enmera --icon windows/src/CouchSubs.App/Assets/CouchSubs.ico --outputDir Releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack başarısız" }
          New-Item -ItemType Directory installer | Out-Null
          Move-Item Releases/CouchSubsApp-win-Setup.exe installer/CouchSubs-windows-Setup.exe
          # Bu sürümün güncelleme dosyaları; önceki sürümden indirilen paketler sürüme yeniden eklenmez.
          Get-ChildItem Releases -File |
            Where-Object { ($_.Name -like "*$version*" -or $_.Name -like "releases.*.json" -or $_.Name -like "assets.*.json" -or $_.Name -eq "RELEASES") -and $_.Name -notlike "*Portable*" } |
            ForEach-Object { Copy-Item $_.FullName installer/ }
          Get-ChildItem installer
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-windows-installer
          path: installer/*
          if-no-files-found: error

      - name: Yerel DLL yayın klasöründe mi
        shell: pwsh
        run: |
          if (-not (Test-Path publish/CouchSubs/couchsubs_native.dll)) { throw "couchsubs_native.dll yayın klasöründe yok" }
          if (-not (Test-Path publish/CouchSubs/tts/pocket-tts.exe)) { throw "pocket-tts.exe yayın klasöründe yok" }

      - uses: actions/upload-artifact@v4
        with:
          name: couchsubs-windows
          path: publish/CouchSubs
          if-no-files-found: error

      # Ekranların görünümü: uygulama bütün ekranları açık ve koyu temada PNG'ye döker.
      - name: Ekran görüntüleri
        shell: pwsh
        run: |
          $p = Start-Process publish/CouchSubs/CouchSubs.exe -ArgumentList "--render-screens", "$PWD/screens" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "ekran görüntüsü aracı zamanında bitmedi" }
          if (Test-Path screens/errors.txt) { Get-Content screens/errors.txt; throw "ekranlardan biri hata verdi" }
          $count = (Get-ChildItem screens -Filter *.png).Count
          if ($count -lt 22) { throw "beklenen 22 ekran görüntüsü, bulunan: $count" }

      # Antivirüs bir DLL'i karantinaya alınca uygulama sessizce kapanmamalı, eksik dosyayı söylemeli.
      - name: Eksik DLL ile açılış
        shell: pwsh
        run: |
          Copy-Item publish/CouchSubs broken -Recurse
          Remove-Item broken/CouchSubs.RemotePlay.dll
          $p = Start-Process broken/CouchSubs.exe -ArgumentList "--render-screens", "$PWD/broken-out" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "uygulama eksik DLL ile takıldı" }
          if (-not (Test-Path broken-out/errors.txt)) { throw "eksik DLL bildirilmedi (çıkış kodu $($p.ExitCode))" }
          $text = Get-Content broken-out/errors.txt -Raw
          $text
          if ($text -notmatch "CouchSubs\.RemotePlay\.dll") { throw "hata metni eksik dosyayı söylemiyor" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couchsubs-screens
          path: screens
          if-no-files-found: error
