# iPhone/iPad uygulaması: bilgisayarın yerine telefon PS5'e bağlanır, altyazıyı okur, çevirir ve TV'ye (ya da kendi
# ekranına) gönderir. Proje dosyası XcodeGen ile üretilir: cd couchsubs-ios && xcodegen
# Remote Play kütüphanesi önce derlenmeli: scripts/build-chiaki-ios.sh (bkz. docs/ios-plan.md).
name: CouchSubs
options:
  bundleIdPrefix: com.couchsubs
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
configFiles:
  # Anahtarlar Config/Secrets.xcconfig'te (gitignore'da); yoksa ilgili özellik kapalı derlenir.
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Enmera (kuruluş hesabı; Mac uygulamasını imzalayan takım).
    DEVELOPMENT_TEAM: 79N3CT6T46
    CODE_SIGN_STYLE: Automatic
    # libchiaki ve bağımlılıkları yalnız arm64 için derleniyor (cihaz ve Apple Silicon simülatörü).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  CouchSubsCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
  # Analytics ve Crashlytics (uygulama ücretsiz ve hesapsız; Auth yok). Reklam yok: AdMob, Google'ın izin formu (UMP) ve
  # Remote Config'teki reklam anahtarı 2026-11-12'de kaldırıldı.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  # Meta App Events: reklam kimliği (IDFA) toplanmaz, izleme izni (ATT) istenmez.
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 18.0.0
targets:
  CouchSubs:
    type: application
    platform: iOS
    sources:
      - CouchSubs
      # Mac uygulamasıyla ortak arayüz parçaları (tasarım değerleri, bileşenler, PSN giriş sayfası).
      - path: ../mac/CouchSubs/UI/Theme.swift
      - path: ../mac/CouchSubs/UI/Components.swift
      - path: ../mac/CouchSubs/UI/LoginWebView.swift
      # Xbox (Beta) hata metinleri Mac uygulamasıyla ortak.
      - path: ../mac/CouchSubs/UI/XboxText.swift
      # "Paketleri şimdi güncelle"nin sonuç metni Mac uygulamasıyla ortak.
      - path: ../mac/CouchSubs/UI/PackUpdateText.swift
      # DeepL anahtarının bu ayki kullanım satırı Mac uygulamasıyla ortak.
      - path: ../mac/CouchSubs/UI/DeepLUsageText.swift
      # Dublaj seslerinin adları Mac uygulamasıyla ortak.
      - path: ../mac/CouchSubs/UI/DubbingVoiceText.swift
      # Yerel model sunucusunun durum iletileri Mac uygulamasıyla ortak.
      - path: ../mac/CouchSubs/UI/LocalAIText.swift
      # Çevrimiçi motor hatasının ana ekran uyarısı Mac uygulamasıyla ortak (GitHub #1322).
      - path: ../mac/CouchSubs/UI/OnlineIssueText.swift
      # Altyazı bölgesinin canlı önizlemesi (sürüklenen çerçeve).
      - path: ../mac/CouchSubs/UI/RegionPreview.swift
      # Ekran yazısının yerinde birebir çizimi (ScreenFit.exact; Mac yayın penceresiyle aynı görünüm).
      - path: ../mac/CouchSubs/UI/ExactScreenText.swift
      # Ayarların ortak değerleri: hız ön ayarları, altyazı renk listeleri, açılış sesi (Mac ile aynı).
      - path: ../mac/CouchSubs/UI/Yeni/SubtitlePalette.swift
      # Perde tasarım dili: tasarim.json'un okunuşu, hareket kapısı, efektler, yeni bileşenler ve bileşen kataloğu (Mac ile
      # aynı kod; platforma özgü küçük farklar dosyaların içinde).
      - path: ../mac/CouchSubs/UI/Yeni/DSTokens.swift
      - path: ../mac/CouchSubs/UI/Yeni/Perde.swift
      - path: ../mac/CouchSubs/UI/Yeni/PerdeCatalog.swift
      # Ekran metinleri Mac uygulamasıyla aynı katalogda (Türkçe).
      - path: ../mac/CouchSubs/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../design/tokens.json
        buildPhase: resources
      # Yeni arayüzün tasarım değerleri, alt reklam şeridinin reklamları ve uygulama simgeleri (Mac ve Windows aynı
      # dosyaları okur).
      - path: ../design/yeni-arayuz/tasarim.json
        buildPhase: resources
      - path: ../design/yeni-arayuz/reklamlar.json
        buildPhase: resources
      - path: ../design/yeni-arayuz/reklam
        type: folder
        buildPhase: resources
      - path: Config
        buildPhase: none
    dependencies:
      - package: CouchSubsCore
      - package: RemotePlay
        product: RemotePlay
      # Reklam kimliği (IDFA) desteği ve reklam dönüşüm kitaplığı olmayan sürüm (GoogleAppMeasurementCore).
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Facebook
        product: FacebookCore
      # Xbox ev yayını (Beta): Mac uygulamasıyla ortak oturum (remoteplay/Sources/XboxStream); Google libwebrtc'nin
      # hazır derlemesini (stasel/WebRTC, BSD-3) o paket getirir. Protokol katmanı CouchSubsCore/Xbox'ta.
      - package: RemotePlay
        product: XboxStream
    postBuildScripts:
      # Telefondan TV kurulumu: Samsung paketi kaynaktan, Android TV ve LG paketleri son GitHub sürümünden
      # (scripts/ios-tv-packages.sh; indirilemezse önceki indirilen kullanılır).
      - name: TV paketleri
        basedOnDependencyAnalysis: false
        script: |
          "${PROJECT_DIR}/../scripts/ios-tv-packages.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
      # Firebase ayar dosyası depoda değil (gitignore); varsa uygulamaya kopyalanır, yoksa Firebase kapalı çalışır.
      - name: GoogleService-Info.plist (varsa)
        basedOnDependencyAnalysis: false
        script: |
          src="${PROJECT_DIR}/Config/GoogleService-Info.plist"
          if [ -f "$src" ]; then cp "$src" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"; fi
      # Crashlytics sembol yüklemesi: yalnız Firebase dosyası varken ve Release derlemesinde.
      - name: Crashlytics dSYM (varsa)
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        script: |
          run="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ "$CONFIGURATION" = "Release" ] && [ -f "${PROJECT_DIR}/Config/GoogleService-Info.plist" ] && [ -x "$run" ]; then "$run"; fi
    info:
      path: CouchSubs/Info.plist
      properties:
        CFBundleDisplayName: CouchSubs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        # Yalnız standart şifreleme (TLS, Remote Play'in standart AES'i): ihracat beyanı her yüklemede sorulmasın.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: CouchSubs connects to your PS5 and TV on the home network to read and send translated subtitles, installs and updates its TV app on your TV, and reaches the local model server (Ollama, LM Studio) on your computer if you choose it.
        # WebRTC kitaplığı kamera ve mikrofon arayüzlerini içerir; kamera hiç açılmaz. Xbox oyun sesi çalınırken WebRTC ses birimi mikrofon iznini sorabilir; yerel ses parçası olmadığından ses gönderilmez.
        NSMicrophoneUsageDescription: CouchSubs never records or sends your voice. To play the Xbox game sound on this iPhone, the streaming library opens the audio system, which may ask for microphone access; you can decline and the sound still plays.
        NSCameraUsageDescription: CouchSubs does not use the camera. The video library used for Xbox streaming includes camera support, which stays off.
        # Samsung girişi sayfası jetonu bu telefondaki http://localhost:4794'e gönderir; TV'lerle düz HTTP konuşulur.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # "Audio, AirPlay, and Picture in Picture": "Arka planda sürdür" ayarının Resim içinde resim penceresi (oyun
        # görüntüsü + canlı altyazı) ve bu telefonda çalınan Xbox oyun sesi için. Sessiz ses çalınmaz (BackgroundPiP.swift;
        # App Review notu: docs/app-store.md).
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Yeni arayüz açık ve koyu görünümü sistemden alır (eskiden hep koyuydu).
        UIUserInterfaceStyle: Automatic
        # Config/App.xcconfig + Secrets.xcconfig'ten (bkz. AppConfig.swift).
        CSPacksBaseURL: $(PACKS_API_BASE_URL)
        CSPacksFallbackURL: $(PACKS_API_FALLBACK_URL)
        # İstek imzası (PackSigning); Secrets.xcconfig ya da derlemede PACKS_APP_SECRET=… Boşsa paket indirme kapalı.
        CSPacksAppSecret: $(PACKS_APP_SECRET)
        FacebookAppID: $(FACEBOOK_APP_ID)
        FacebookClientToken: $(FACEBOOK_CLIENT_TOKEN)
        FacebookDisplayName: CouchSubs
        # Meta reklam kimliği (IDFA) hiç toplamaz; olaylar karşılama ekranından sonra kendiliğinden de gönderilir
        # (Integrations.startMeta).
        FacebookAutoLogAppEventsEnabled: false
        FacebookAdvertiserIDCollectionEnabled: false
        # Meta girişi ya da paylaşımı kullanılmıyor; "fb" adres şeması gerekmez. Anahtarsız yapıda yalnız "fb" kalıyor ve
        # App Store yüklemeyi reddediyor ("URL schemes ... disallowed: [fb]").
        # Meta'nın SKAdNetwork kimlikleri (Meta reklamlarının yükleme ölçümü). Google'ın (AdMob) listesi reklamla birlikte
        # kaldırıldı.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
    entitlements:
      path: CouchSubs/CouchSubs.entitlements
      properties:
        # PS5 ve TV'yi ağda bulmak (UDP yayını, SSDP) bu yetkiyi ister; Apple'dan ayrıca istenir
        # (developer.apple.com/contact/request/networking-multicast). Onay gelene kadar cihaz imzası için
        # bu satır kaldırılır ve PS5/TV adresi elle yazılır (docs/ios-plan.md).
        com.apple.developer.networking.multicast: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Yalnız iPhone: iPad'de iPhone uyumluluk kipinde açılır (App Store iPad ekran görüntüsü istemez).
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # Crashlytics betiği Info.plist'i okur.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  CouchSubsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CouchSubsTests
    dependencies:
      - target: CouchSubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CouchSubs.app/CouchSubs"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CouchSubs:
    build:
      targets:
        CouchSubs: all
        CouchSubsTests: [test]
    test:
      targets:
        - CouchSubsTests
