# iPhone/iPad uygulaması: bilgisayarın yerine telefon PS5'e bağlanır, altyazıyı okur, çevirir ve TV'ye (ya da kendi
# ekranına) gönderir. Proje dosyası XcodeGen ile üretilir: cd couchsubs-ios && xcodegen
# Remote Play kütüphanesi önce derlenmeli: scripts/build-chiaki-ios.sh (bkz. docs/ios-plan.md).
name: CouchSubs
options:
  bundleIdPrefix: com.couchsubs
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
configFiles:
  # Anahtarlar Config/Secrets.xcconfig'te (gitignore'da); yoksa ilgili özellik kapalı derlenir.
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Enmera (kuruluş hesabı; Mac uygulamasını imzalayan takım).
    DEVELOPMENT_TEAM: 79N3CT6T46
    CODE_SIGN_STYLE: Automatic
    # libchiaki ve bağımlılıkları yalnız arm64 için derleniyor (cihaz ve Apple Silicon simülatörü).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  CouchSubsCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
  # Analytics ve Crashlytics (uygulama ücretsiz ve hesapsız; Auth yok). Reklam yok: AdMob, Google'ın izin formu (UMP) ve
  # Remote Config'teki reklam anahtarı 2026-11-12'de kaldırıldı.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  # Meta App Events: reklam kimliği (IDFA) toplanmaz, izleme izni (ATT) istenmez.
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 18.0.0
targets:
  CouchSubs:
    type: application
    platform: iOS
    sources:
      - CouchSubs
      # Mac uygulamasıyla ortak arayüz parçaları (tasarım değerleri, bileşenler, PSN giriş sayfası).
      - path: ../mac/CouchSubs/UI/Theme.swift
      - path: ../mac/CouchSubs/UI/Components.swift
      - path: ../mac/CouchSubs/UI/LoginWebView.swift
      # Altyazı bölgesinin canlı önizlemesi (sürüklenen çerçeve).
      - path: ../mac/CouchSubs/UI/RegionPreview.swift
      # Ekran metinleri Mac uygulamasıyla aynı katalogda (Türkçe).
      - path: ../mac/CouchSubs/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../design/tokens.json
        buildPhase: resources
      - path: Config
        buildPhase: none
    dependencies:
      - package: CouchSubsCore
      - package: RemotePlay
      # Reklam kimliği (IDFA) desteği ve reklam dönüşüm kitaplığı olmayan sürüm (GoogleAppMeasurementCore).
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Facebook
        product: FacebookCore
    postBuildScripts:
      # Firebase ayar dosyası depoda değil (gitignore); varsa uygulamaya kopyalanır, yoksa Firebase kapalı çalışır.
      - name: GoogleService-Info.plist (varsa)
        basedOnDependencyAnalysis: false
        script: |
          src="${PROJECT_DIR}/Config/GoogleService-Info.plist"
          if [ -f "$src" ]; then cp "$src" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"; fi
      # Crashlytics sembol yüklemesi: yalnız Firebase dosyası varken ve Release derlemesinde.
      - name: Crashlytics dSYM (varsa)
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        script: |
          run="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ "$CONFIGURATION" = "Release" ] && [ -f "${PROJECT_DIR}/Config/GoogleService-Info.plist" ] && [ -x "$run" ]; then "$run"; fi
    info:
      path: CouchSubs/Info.plist
      properties:
        CFBundleDisplayName: CouchSubs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        # Yalnız standart şifreleme (TLS, Remote Play'in standart AES'i): ihracat beyanı her yüklemede sorulmasın.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: CouchSubs connects to your PS5 and TV on the home network to read and send translated subtitles.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Config/App.xcconfig + Secrets.xcconfig'ten (bkz. AppConfig.swift).
        CSPacksBaseURL: $(PACKS_API_BASE_URL)
        FacebookAppID: $(FACEBOOK_APP_ID)
        FacebookClientToken: $(FACEBOOK_CLIENT_TOKEN)
        FacebookDisplayName: CouchSubs
        # Meta reklam kimliği (IDFA) hiç toplamaz; olaylar karşılama ekranından sonra kendiliğinden de gönderilir
        # (Integrations.startMeta).
        FacebookAutoLogAppEventsEnabled: false
        FacebookAdvertiserIDCollectionEnabled: false
        # Meta girişi ya da paylaşımı kullanılmıyor; "fb" adres şeması gerekmez. Anahtarsız yapıda yalnız "fb" kalıyor ve
        # App Store yüklemeyi reddediyor ("URL schemes ... disallowed: [fb]").
        # Meta'nın SKAdNetwork kimlikleri (Meta reklamlarının yükleme ölçümü). Google'ın (AdMob) listesi reklamla birlikte
        # kaldırıldı.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
    entitlements:
      path: CouchSubs/CouchSubs.entitlements
      properties:
        # PS5 ve TV'yi ağda bulmak (UDP yayını, SSDP) bu yetkiyi ister; Apple'dan ayrıca istenir
        # (developer.apple.com/contact/request/networking-multicast). Onay gelene kadar cihaz imzası için
        # bu satır kaldırılır ve PS5/TV adresi elle yazılır (docs/ios-plan.md).
        com.apple.developer.networking.multicast: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Yalnız iPhone: iPad'de iPhone uyumluluk kipinde açılır (App Store iPad ekran görüntüsü istemez).
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        # Crashlytics betiği Info.plist'i okur.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  CouchSubsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CouchSubsTests
    dependencies:
      - target: CouchSubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couchsubs.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CouchSubs.app/CouchSubs"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CouchSubs:
    build:
      targets:
        CouchSubs: all
        CouchSubsTests: [test]
    test:
      targets:
        - CouchSubsTests
