# iPhone/iPad uygulaması: bilgisayarın yerine telefon PS5'e bağlanır, altyazıyı okur, çevirir ve TV'ye (ya da kendi
# ekranına) gönderir. Proje dosyası XcodeGen ile üretilir: cd couchsubs-ios && xcodegen
# Remote Play kütüphanesi önce derlenmeli: scripts/build-chiaki-ios.sh (bkz. docs/ios-plan.md).
name: CouchSubs
options:
  bundleIdPrefix: com.couchsubs
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
configFiles:
  # Anahtarlar Config/Secrets.xcconfig'te (gitignore'da); yoksa ilgili özellik kapalı derlenir.
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Enmera (kuruluş hesabı; Mac uygulamasını imzalayan takım).
    DEVELOPMENT_TEAM: 79N3CT6T46
    CODE_SIGN_STYLE: Automatic
    # libchiaki ve bağımlılıkları yalnız arm64 için derleniyor (cihaz ve Apple Silicon simülatörü).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  CouchSubsCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
  # Analytics, Crashlytics, Remote Config (uygulama ücretsiz ve hesapsız; Auth yok).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  # Meta App Events (izinle).
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 18.0.0
  # AdMob ve Google'ın izin formu (UMP); reklam Remote Config `ads_enabled` ile açılır, varsayılan kapalı.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
targets:
  CouchSubs:
    type: application
    platform: iOS
    sources:
      - CouchSubs
      # Mac uygulamasıyla ortak arayüz parçaları (tasarım değerleri, bileşenler, PSN giriş sayfası).
      - path: ../mac/CouchSubs/UI/Theme.swift
      - path: ../mac/CouchSubs/UI/Components.swift
      - path: ../mac/CouchSubs/UI/LoginWebView.swift
      # Ekran metinleri Mac uygulamasıyla aynı katalogda (Türkçe).
      - path: ../mac/CouchSubs/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../design/tokens.json
        buildPhase: resources
      - path: Config
        buildPhase: none
    dependencies:
      - package: CouchSubsCore
      - package: RemotePlay
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Facebook
        product: FacebookCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    postBuildScripts:
      # Firebase ayar dosyası depoda değil (gitignore); varsa uygulamaya kopyalanır, yoksa Firebase kapalı çalışır.
      - name: GoogleService-Info.plist (varsa)
        basedOnDependencyAnalysis: false
        script: |
          src="${PROJECT_DIR}/Config/GoogleService-Info.plist"
          if [ -f "$src" ]; then cp "$src" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"; fi
      # Crashlytics sembol yüklemesi: yalnız Firebase dosyası varken ve Release derlemesinde.
      - name: Crashlytics dSYM (varsa)
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        script: |
          run="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ "$CONFIGURATION" = "Release" ] && [ -f "${PROJECT_DIR}/Config/GoogleService-Info.plist" ] && [ -x "$run" ]; then "$run"; fi
    info:
      path: CouchSubs/Info.plist
      properties:
        CFBundleDisplayName: CouchSubs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr]
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: CouchSubs connects to your PS5 and TV on the home network to read and send translated subtitles.
        NSUserTrackingUsageDescription: Your permission lets us measure which ads brought you to CouchSubs. CouchSubs works the same without it.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Config/App.xcconfig + Secrets.xcconfig'ten (bkz. AppConfig.swift).
        CSPacksBaseURL: $(PACKS_API_BASE_URL)
        FacebookAppID: $(FACEBOOK_APP_ID)
        FacebookClientToken: $(FACEBOOK_CLIENT_TOKEN)
        FacebookDisplayName: CouchSubs
        # İzin gelene kadar Meta reklam kimliği toplamaz ve olayları kendiliğinden göndermez.
        FacebookAutoLogAppEventsEnabled: false
        FacebookAdvertiserIDCollectionEnabled: false
        GADApplicationIdentifier: $(GAD_APPLICATION_ID)
        GADDelayAppMeasurementInit: true
        CFBundleURLTypes:
          - CFBundleURLName: facebook
            CFBundleURLSchemes: [fb$(FACEBOOK_APP_ID)]
        LSApplicationQueriesSchemes: [fbapi, fb-messenger-share-api]
        # Google (AdMob) ve Meta'nın SKAdNetwork kimlikleri; yayın öncesi güncel listeyle karşılaştırılmalı.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
