<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Ekran her TV'de 1920 piksel genişliğinde düzenlenir. Android TV'nin WebView'i bunu vermezse 1080p ekranı 960 piksel
       sayıyor ve yazılar iki kat büyük çıkıyordu (TCL C6K, #7). LG ve Samsung zaten 1920 kullanır. initial-scale
       verilmez: Android'de 1 ölçeği sayfanın yalnız sol üst çeyreğini gösterip altyazıyı ekran dışında bırakıyordu;
       sığdırma ölçeğini MainActivity hesaplar. -->
  <meta name="viewport" content="width=1920">
  <title>CouchSubs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="video-host"></div>

  <div id="screen" class="hidden"></div>
  <div id="subtitle-cover" class="hidden"></div>
  <div id="subtitle" class="hidden"><div id="subtitle-prev2" class="hidden"><span id="subtitle-prev2-text"></span></div><div id="subtitle-prev" class="hidden"><span id="subtitle-prev-text"></span></div><span id="subtitle-text"></span></div>

  <div id="waiting" class="hidden">
    <img class="logo" src="largeIcon.png" alt="">
    <div class="waiting-title" data-i18n="waiting"></div>
    <div class="waiting-hint" data-i18n="waitingHint"></div>
    <div id="demo-button" class="button focused" data-i18n="demoButton"></div>
  </div>

  <div id="demo-badge" class="hidden"><b data-i18n="demoBadge"></b><span data-i18n="demoHint"></span></div>

  <!-- Samsung: TV kendiliğinden HDMI girişine geçtiyse (Anynet+) ne yapılacağı. -->
  <div id="source-tip" class="hidden"><b data-i18n="sourceSwitchTitle"></b><span data-i18n="sourceSwitchHint"></span><span class="close" data-i18n="sourceSwitchClose"></span></div>

  <div id="panel">
    <div class="title"><img class="logo" src="icon.png" alt=""><span data-i18n="panelTitle"></span> <span id="app-version" class="muted" style="margin-left: 12px; font-weight: 400;"></span></div>
    <div class="row"><span class="label" data-i18n="hdmi"></span><span><span id="st-hdmi">-</span> <span id="st-video" class="muted"></span></span></div>
    <div class="row"><span class="label" data-i18n="server"></span><span id="st-server">-</span></div>
    <div class="row"><span class="label" data-i18n="connection"></span><span id="st-conn">-</span></div>
    <div class="row"><span class="label" data-i18n="lastSubtitle"></span><span id="st-last" class="muted">-</span></div>
    <div class="row"><span class="label" data-i18n="diagnostics"></span><span id="st-diag" class="muted">-</span></div>
    <div class="keys" id="keys" data-i18n="keys"></div>
  </div>

  <script src="config.js"></script>
  <script src="platform.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
