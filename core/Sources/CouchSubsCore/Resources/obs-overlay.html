<!doctype html>

<!-- CouchSubs OBS katmanı: OBS'de "Tarayıcı kaynağı" olarak eklenir, Türkçe altyazıyı şeffaf zemin üstünde gösterir.
     Mac ve Windows uygulaması bu dosyayı /obs adresinden verir (aynı dosya). Adres parametreleri:
     ?size=48 (yazı boyu, 1080p'de piksel), ?bottom=8 (alttan uzaklık, %), ?bg=60 (altyazı kutusunun koyuluğu, 0-100),
     ?bg=green | black | magenta (tüm sayfanın zemini; şeffaflık tanımayan yayın programlarında chroma key ile silinir),
     ?hint=1 / ?hint=0 (altyazı gelene kadar kısa "Altyazı bekleniyor" ipucu; OBS'te varsayılan kapalı, başka yerde açık). -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CouchSubs OBS</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Yazı keskin çizilsin: gri tonlu kenar yumuşatma (renkli alt piksel yumuşatma video kaynağında kenarda renk
     saçağı bırakır), tam piksele yuvarlanmış yazı boyu ve yarım piksele düşen kaydırma yok (bkz. #wrap). */
  body {
    /* Telefon katmanı sayfa zemininden yukarıda, ana altyazının altında kalır. */
    isolation: isolate;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision; font-kerning: normal;
  }
  #wrap {
    position: absolute; left: 0; right: 0; bottom: 7%;
    display: flex; justify-content: center; pointer-events: none;
    /* Kap tüm sayfayı kaplasa da (örtme) kutu yazı kadar kalır; tam yüksekliğe uzayıp siyah sütun olmaz. */
    align-items: flex-start;
  }
  #line {
    max-width: 84vw; padding: 0.25em 0.6em; border-radius: 0.3em;
    font: 600 48px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #fff; text-align: center; white-space: pre-line;
    text-shadow: 0 0 0.12em #000, 0 0.06em 0.12em #000;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0; visibility: hidden; transition: opacity 0.15s, visibility 0s linear 0.15s;
  }
  #line.on { opacity: 1; visibility: visible; transition: opacity 0.15s; }
  /* İngilizce altyazının yeri biliniyorsa çeviri onu örter (TV'deki "örtme" ile aynı). Genişlik yazının kendisi kadardır
     (en çok 84vw): konumlanmış kutu kendiliğinden yalnız soldaki boşluktan sağ kenara kadar genişleyebiliyordu (ortada
     50vw); uygulamanın iki satıra böldüğü çeviri OBS'te yeniden bölünüp 3-4 satır oluyordu. */
  #line.cover { position: absolute; transform: translate(-50%, -50%); width: max-content; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 7%; text-align: center;
    font: 600 28px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.85); text-shadow: 0 0 0.15em #000;
    display: none;
  }
  /* Ek alanların (görev, telefon mesajı, bildirim) çevirisi: oyundaki yazının yerinde, altyazıdan küçük koyu kutu. */
  #regions { position: absolute; inset: 0; pointer-events: none; }
  #phone-region { z-index: -1; }
  .region {
    position: absolute; box-sizing: border-box; padding: 0.3em 0.6em; border-radius: 0.3em;
    font: 600 26px/1.25 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #fff; white-space: pre-line; background: rgba(0, 0, 0, 0.85);
  }
  .phone-blocks { position: absolute; inset: 0; }
  .phone-blocks .phone {
    position: absolute; box-sizing: border-box; padding: 1px 2px; border-radius: 2px;
    color: #fff; background: #24272a; font: 500 16px/1.1 -apple-system, "Segoe UI", system-ui, sans-serif;
    white-space: pre-line; overflow-wrap: anywhere; text-align: left;
  }
  .phone .icon { height: 1.1em; vertical-align: -0.2em; }
  /* Otomatik bulunan ekran yazısı: özgün yazının zemini, rengi, kalınlığı ve hizasıyla kendi yerinde (TV ile aynı). */
  .phone-blocks .phone.auto { padding: 1px 4px; border-radius: 3px; font-weight: 500; text-align: center; }
  /* Yerinde birebir çizim (TV ile aynı): opak, köşesiz, gölgesiz; satırlar kendi yerinde, kesilmez. */
  .phone-blocks .phone.exact { padding: 0; border-radius: 0; box-shadow: none; text-shadow: none; white-space: nowrap; overflow: visible; }
  .phone-blocks .phone.exact .exact-line { position: absolute; left: 0; right: 0; white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><div id="line"></div></div>
<div id="hint"></div>
<div id="regions"></div>
<script>
(function () {
  var wrap = document.getElementById('wrap');
  var line = document.getElementById('line');
  var hintBox = document.getElementById('hint');
  var regionsBox = document.getElementById('regions');
  var regions = {};
  var params = new URLSearchParams(location.search);
  // Sayfa zemini (chroma key için): adla verilen renkler. Sayı verilirse eskisi gibi altyazı kutusunun koyuluğudur.
  var PAGE_COLORS = { green: '#00FF00', black: '#000000', magenta: '#FF00FF', blue: '#0000FF' };
  var rawBg = (params.get('bg') || '').toLowerCase();
  var pageColor = PAGE_COLORS[rawBg] || null;
  var fixed = { size: params.get('size'), bottom: params.get('bottom'), bg: pageColor ? null : params.get('bg') };
  var timer = null;
  // Oyundaki altyazının son bilinen yeri ("Örtsün"de yeri gelmeyen satır için).
  var lastBox = null;
  var hintTimer = null;
  var placement = 'cover';
  // Son altyazının yerleşimi: 'fixed' (sabit yükseklik), 'cover', 'above' ya da 'below'.
  var shownMode = 'fixed';
  var lastStyle = {};
  var TEXT_COLORS = { white: '#FFFFFF', yellow: '#FFE135' };
  var turkish = (navigator.language || 'tr').toLowerCase().indexOf('tr') === 0;
  var TEXTS = turkish
    ? { waiting: 'CouchSubs: altyazı bekleniyor', offline: 'CouchSubs uygulamasına bağlanılamadı' }
    : { waiting: 'CouchSubs: waiting for subtitles', offline: 'Cannot reach the CouchSubs app' };

  if (pageColor) document.documentElement.style.background = document.body.style.background = pageColor;

  // İpucu OBS'te (yayında görünmesin diye) varsayılan kapalı; OBS tarayıcısı window.obsstudio'yu tanımlar.
  var inObs = !!window.obsstudio || /\bOBS\//.test(navigator.userAgent);
  var hintParam = params.get('hint');
  var hintOn = hintParam === null ? !inObs : hintParam !== '0';

  function showHint(text, seconds) {
    if (!hintOn) return;
    clearTimeout(hintTimer);
    hintBox.textContent = text;
    hintBox.style.display = 'block';
    hintTimer = setTimeout(hideHint, seconds * 1000);
  }

  function hideHint() {
    clearTimeout(hintTimer);
    hintBox.style.display = 'none';
  }

  // Uzun çeviri tek uzun satır olarak taşmasın: satır başına en çok 42 karakter, en çok 3 satır, kelime sınırından ve
  // dengeli bölünür; 3 satıra sığmazsa yazı biraz küçülür (en çok %75). Konuşan adı ("ARTHUR:") hep ilk satırdadır.
  // Mac, Windows, Android ve TV (SubtitleWrap / tv-webos/app.js) aynı kuralları uygular.
  var WRAP_MAX_CHARS = 42, WRAP_MAX_LINES = 3, WRAP_MIN_SCALE = 1;
  var baseSize = 48, textScale = 1;

  function wrapTokens(text) {
    var words = text.split(/\s+/).filter(function (w) { return w; });
    for (var i = 0; i < Math.min(3, words.length); i++) {
      var last = words[i].charAt(words[i].length - 1);
      if (last === ':' || last === '\uFF1A') {
        if (i + 1 < words.length) words.splice(0, i + 2, words.slice(0, i + 2).join(' '));
        break;
      }
    }
    return words;
  }

  function wrapWidth(words, from, to) {
    var sum = to - from - 1;
    for (var i = from; i < to; i++) sum += words[i].length;
    return sum;
  }

  function wrapBalance(words, lines) {
    var count = words.length, best = null, a, b;
    function consider(cuts) {
      var edges = [0].concat(cuts, [count]), longest = 0, spread = 0;
      for (var i = 0; i < edges.length - 1; i++) {
        var width = wrapWidth(words, edges[i], edges[i + 1]);
        longest = Math.max(longest, width);
        spread += width * width;
      }
      if (!best || longest < best.longest || (longest === best.longest && spread < best.spread)) {
        best = { longest: longest, spread: spread, cuts: cuts };
      }
    }
    if (lines === 2 || count < 3) {
      for (a = 1; a < count; a++) consider([a]);
    } else {
      for (a = 1; a < count - 1; a++) for (b = a + 1; b < count; b++) consider([a, b]);
    }
    if (!best) return words.join(' ');
    var all = [0].concat(best.cuts, [count]), out = [];
    for (var i = 0; i < all.length - 1; i++) out.push(words.slice(all[i], all[i + 1]).join(' '));
    return out.join('\n');
  }

  function wrapSubtitle(text) {
    var length = Array.from ? Array.from(text).length : text.length;
    if (length <= WRAP_MAX_CHARS || text.indexOf('\n') >= 0) return { text: text, scale: 1 };
    var words = wrapTokens(text);
    if (words.length < 2) return { text: text, scale: 1 };
    var scale = Math.min(1, Math.max(WRAP_MIN_SCALE, WRAP_MAX_CHARS * WRAP_MAX_LINES / length));
    var cap = Math.floor(WRAP_MAX_CHARS / scale);
    var lines = Math.min(WRAP_MAX_LINES, Math.max(2, Math.ceil(length / cap)));
    return { text: wrapBalance(words, Math.min(lines, words.length)), scale: scale };
  }

  // Örtme (cover): kutu en az İngilizce satır kadar geniştir. Çeviri 42 karakter kuralıyla dengeli bölününce geniş kutunun
  // ortasında dar iki satır kalıyor, iki yanda boş siyah alan oluşuyordu ("Yerel bağımlılar ona katalitik / konvertörü
  // …": kutu yazıdan her yanda ~%20 genişti). TV uygulamasındaki gibi (tv-webos/app.js wrapToCover) 1-3 satırın her biri
  // için örtü ile yazının birleşik kutusunun alanı hesaplanır, en küçüğü seçilir; bir satır daha ancak kutuyu en az %20
  // küçültüyorsa eklenir. Ölçüm yapılamazsa null döner, 42 karakter kuralı geçerli kalır.
  var COVER_LINE_GAIN = 0.8, measureContext = null;
  function textWidth(text, font) {
    if (measureContext === null) {
      var canvas = document.createElement('canvas');
      measureContext = (canvas.getContext && canvas.getContext('2d')) || false;
    }
    if (!measureContext) return 0;
    measureContext.font = font;
    var widest = 0, parts = text.split('\n');
    for (var i = 0; i < parts.length; i++) widest = Math.max(widest, measureContext.measureText(parts[i]).width);
    return widest;
  }

  // scale: yazı boyu çarpanı (örtüde hep 1). Ölçüm yapılamazsa null, hiçbir bölme 3 satırda sığmazsa false.
  function wrapToCover(text, box, scale) {
    if (!box || text.indexOf('\n') >= 0) return null;
    var words = wrapTokens(text);
    var style = window.getComputedStyle(line);
    var size = parseFloat(pixels(baseSize * scale));
    var font = style.fontWeight + ' ' + size + 'px ' + style.fontFamily;
    var pageWidth = window.innerWidth || 1920, pageHeight = window.innerHeight || 1080;
    // İç boşluk: yanlarda 0.6em, üstte ve altta 0.25em (#line); en çok 84vw.
    var pad = size * 1.2, room = pageWidth * 0.84 - pad;
    var coverWidth = (box.right - box.left) * pageWidth, coverHeight = (box.bottom - box.top) * pageHeight;
    var best = null;
    for (var lines = 1; lines <= Math.min(WRAP_MAX_LINES, words.length); lines++) {
      var candidate = lines === 1 ? words.join(' ') : wrapBalance(words, lines);
      var width = textWidth(candidate, font);
      if (!width) return null;
      if (width > room) continue;
      var area = Math.max(coverWidth, width + pad) * Math.max(coverHeight, size * (1.3 * lines + 0.5));
      if (!best || area < best.area * COVER_LINE_GAIN) best = { text: candidate, area: area };
    }
    return best ? { text: best.text, scale: scale } : false;
  }

  // "Örtsün"de yazı boyu sabittir (Mac/Windows: CoverFontScale, TV: coverWrap): her satır kullanıcının seçtiği boyda, kutu
  // çeviriye göre genişler. Yazı 3 satıra sığmıyorsa küçülmez: 3 dengeli satır, tarayıcı uzun satırı kendisi böler. Eskiden
  // 3 satıra sığmayan tek satır yazıyı %80'e indiriyor, boy ayarı değişene dek öyle bırakıyordu (X, beta.89).
  function wrapAt(text) {
    var length = Array.from ? Array.from(text).length : text.length;
    if (length <= WRAP_MAX_CHARS || text.indexOf('\n') >= 0) return { text: text, scale: 1 };
    var words = wrapTokens(text);
    if (words.length < 2) return { text: text, scale: 1 };
    var lines = Math.min(WRAP_MAX_LINES, Math.max(2, Math.ceil(length / WRAP_MAX_CHARS)));
    return { text: wrapBalance(words, Math.min(lines, words.length)), scale: 1 };
  }
  function coverWrap(text, box) {
    if (text.indexOf('\n') >= 0) return { text: text, scale: 1 };
    return wrapToCover(text, box, 1) || wrapAt(text);
  }

  // Örtü kutusunun her yana bıraktığı pay (1080 satırlık ekranda piksel; Mac ve Windows'taki OverlayCover ile aynı).
  var COVER_MARGIN = 8;

  /// Yazı boyu 1080 satırlık ekrana göredir; sayfanın gerçek yüksekliğinde tam piksele yuvarlanır (keskin yazı).
  function pixels(size) {
    return Math.max(8, Math.round(size * (window.innerHeight || 1080) / 1080)) + 'px';
  }

  /// Sayfa renkli zeminliyse yarı saydam kutu zeminle karışıp chroma key'i bozar; kutu ya tam koyu ya hiç yoktur.
  // Zeminin rengi (yeni arayüz: style.backgroundColor, "#RRGGBB"); göndermeyen bilgisayarda siyah.
  var boxRgb = '0, 0, 0';

  function hexRgb(hex) {
    if (typeof hex !== 'string' || !/^#[0-9A-Fa-f]{6}$/.test(hex)) return null;
    var value = parseInt(hex.slice(1), 16);
    return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
  }

  function boxColor(percent) {
    var alpha = Math.max(0, Math.min(100, percent)) / 100;
    if (pageColor) alpha = alpha > 0 ? 1 : 0;
    return 'rgba(' + boxRgb + ', ' + alpha + ')';
  }

  /// "Örtsün"ün zemini seçilen zemin renginde ve "Zemin koyuluğu"ndan bağımsız tam opaktır: oyundaki altyazıyı kapatmak bu
  /// yerleşimin işi (TV app.js ownBackground ile aynı). Eskiden koyuluğu izliyordu (#225): varsayılan %72'de ve kaydırıcı
  /// düşükken İngilizce satır Türkçenin altından görünüyordu (X, MertTurna19). Renkli sayfada (chroma key) siyah.
  function coverColor() {
    return pageColor ? '#000' : 'rgb(' + boxRgb + ')';
  }

  function apply(style) {
    style = style || {};
    lastStyle = style;
    // "Ekran yazılarını altyazıdan ayır" (alanı göndermeyen eski uygulamada açık).
    setApart = style.setApart !== false;
    var size = Number(fixed.size || style.fontSize || 48);
    if (size > 0) { baseSize = size; line.style.fontSize = pixels(size * textScale); }
    hintBox.style.fontSize = pixels(Math.max(20, Math.round((size > 0 ? size : 48) * 0.6)));
    var bottom = Number(fixed.bottom || style.bottomPercent);
    if (bottom >= 0 && bottom <= 85) {
      hintBox.style.bottom = bottom + '%';
      // İngilizce satıra göre yerleşen altyazının kabı ayar gelince sabit yüksekliğe kaymasın.
      if (shownMode === 'fixed') wrap.style.bottom = bottom + '%';
    }
    var rgb = hexRgb(style.backgroundColor);
    boxRgb = rgb ? rgb.join(', ') : '0, 0, 0';
    speakerNameOnly = style.nameOnly === true;
    speakerWholeLine = style.wholeLine === true;
    var bg = fixed.bg !== null ? Number(fixed.bg) : style.background;
    if (typeof bg === 'number' && !isNaN(bg)) line.style.background = boxColor(bg);
    else if (pageColor) line.style.background = boxColor(60);
    if (typeof style.bold === 'boolean') line.style.fontWeight = style.bold ? '700' : '600';
    if (hexRgb(style.textHex)) line.style.color = style.textHex;
    else if (TEXT_COLORS[style.textColor]) line.style.color = TEXT_COLORS[style.textColor];
    if (style.placement) placement = style.placement;
    for (var id in regions) styleRegion(regions[id]);
  }

  /// Kutunun sayıları geçerli mi (0–1 arası, sağ soldan, alt üstten büyük; TV'deki validBox ile aynı).
  function validBox(b) {
    if (!b || typeof b !== 'object' ||
        ![b.left, b.top, b.right, b.bottom].every(function (n) { return typeof n === 'number' && n >= 0 && n <= 1; })) return null;
    return b.right > b.left && b.bottom > b.top ? b : null;
  }

  /// Ek alanın kutusu yazının karedeki yerine (box: 0-1 kesirler) oturur. Yeri bilinmeyen alan çizilmez (showRegion):
  /// önceden üstte ortaya, sıfır alanlı kutuda ekranın ortasına çiziliyordu (TV ile aynı).
  function styleRegion(node) {
    if (node.className === 'phone-blocks' || !node.box) return;
    var box = node.box;
    delete node.dataset.baseTransform;
    node.style.fontSize = pixels(Math.max(12, baseSize * 0.55));
    node.style.color = line.style.color || '#fff';
    if (pageColor) node.style.background = '#000';
    node.style.left = (box.left * 100) + '%';
    node.style.top = (box.top * 100) + '%';
    node.style.transform = '';
    node.style.minWidth = ((box.right - box.left) * 100) + 'vw';
    node.style.maxWidth = (Math.max(box.right - box.left, Math.min(0.45, 1 - box.left)) * 100) + 'vw';
  }

  /// Ek alan olayı: metin boşsa ya da yeri bilinmiyorsa (geçersiz kutu) alanın kutusu kalkar; çeviri asla ortaya
  /// çizilmez (TV ve uygulama pencereleriyle aynı).
  function showRegion(id, text, box, blocks) {
    if (!id) return;
    var node = regions[id];
    box = validBox(box);
    if (!text || !box) {
      if (node) { regionsBox.removeChild(node); delete regions[id]; }
      resolveLayers();
      avoidRegions();
      return;
    }
    hideHint();
    if (!node) {
      node = document.createElement('div');
      if (id === 'game-phone') node.id = 'phone-region';
      regionsBox.appendChild(node);
      regions[id] = node;
    }
    // Otomatik ekran yazısı ve özgün görünüşü taşıyan bloklar (oyunun hazır alanı, #856): her blok kendi yerinde, özgün
    // renginde (TV ile aynı kural).
    var auto = setApart && (id.indexOf('auto-') === 0 || (Array.isArray(blocks) && blocks.some(function (b) {
      return b && b.style && typeof b.style === 'object';
    })));
    node.stamp = ++regionStamp;
    if ((id === 'game-phone' || auto) && Array.isArray(blocks) && blocks.length) {
      node.textContent = '';
      node.style.cssText = '';
      node.className = 'phone-blocks';
      var exact = [];
      for (var i = 0; i < blocks.length; i++) {
        if (auto && isExact(blocks[i]) && blocks[i].bubble !== true) exact.push(blocks[i]);
        else placePhoneBlock(node, blocks[i], auto);
      }
      if (exact.length) placeExact(node, exact);
      resolveLayers();
      avoidRegions();
      if (node.firstChild) return;
    }
    node.className = 'region';
    node.textContent = text;
    resolveLayers();
    node.box = box;
    styleRegion(node);
    avoidRegions();
  }

  // Yerinde birebir çizim (TV uygulaması 0.9.102 placeExact ile aynı yerleşim; aşağıdaki EXACT_* .. exactParagraph TV'nin
  // app.js'inden birebir alınmıştır, scripts/tv-exact-fit.test.js ikisinin aynı kaldığını denetler): bilgisayarın ölçtüğü
  // örtü kutusu, zemin/degrade, yazı rengi, kalınlık, hiza ve satır aralığıyla; opak, köşesiz, gölgesiz; yazı kesilmez.
  function exactColor(value) { return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value); }
  var EXACT_FONT = 0.95;
  var EXACT_GROUP_MIN = 0.7;
  var EXACT_PARAGRAPH_MIN = 0.8;
  var EXACT_WRAP_GAP = 1.2;

  function isExact(item) {
    return !!(item && typeof item.text === 'string' && item.text && exactColor(item.bg) && exactColor(item.fg)
      && validBox(item.cover) && validBox(item.box));
  }

  function exactWrap(words, limit, measure) {
    var lines = [], current = '';
    for (var i = 0; i < words.length; i++) {
      var next = current ? current + ' ' + words[i] : words[i];
      if (current && measure(next) > limit + 0.5) {
        lines.push(current);
        current = words[i];
      } else current = next;
    }
    if (current || !lines.length) lines.push(current);
    return lines;
  }

  function exactWords(text) {
    var words = text.split(/\s+/), result = [];
    for (var i = 0; i < words.length; i++) if (words[i]) result.push(words[i]);
    return result;
  }

  // Saf yerleşim (ScreenFit.exact): items piksel cinsinden {text, left, top, right, bottom, growLeft, growRight, line, pitch,
  // rows, align, group}; measure(text, size, index) yazının genişliği. Dönen: {left, top, width, height, fontSize, lines,
  // lineHeight, rowHeight}.
  function exactLayout(items, measure) {
    var base = [], members = {}, i;
    for (i = 0; i < items.length; i++) {
      base.push(EXACT_FONT * items[i].line);
      if (typeof items[i].group === 'number') (members[items[i].group] = members[items[i].group] || []).push(i);
    }
    var key, list, k;
    for (key in members) {
      if (!Object.prototype.hasOwnProperty.call(members, key) || members[key].length < 2) continue;
      list = members[key];
      var sizes = [];
      for (k = 0; k < list.length; k++) sizes.push(base[list[k]]);
      sizes.sort(function (a, b) { return a - b; });
      for (k = 0; k < list.length; k++) base[list[k]] = sizes[Math.floor(sizes.length / 2)];
    }
    function isLabel(item) { return !(item.rows > 1) && item.text.indexOf('\n') < 0; }
    var natural = [], scale = [];

    });
  }

  // Ekran yazısı (görev satırı, ek alan) ile altyazı üst üste binmesin. Altyazının yeri kullanıcının seçimidir, değişmez:
  // çakışan ekran yazısı kutusu yalnız gerektiği kadar (küçük boşlukla) altyazıdan uzağa kayar (TV: avoidRegions).
  // Oyun telefonu kaydırılmaz; altyazı telefonun üstüne binmez, kendisi telefonun yanına (sığmazsa üstüne/altına) kayar
  // (avoidPhone; TV ile aynı).
  var setApart = true;
  function shiftBox(el, dy) {
    var base = el.dataset.baseTransform !== undefined ? el.dataset.baseTransform : (el.dataset.baseTransform = el.style.transform || '');
    el.style.transform = dy ? (base + ' translateY(' + Math.round(dy) + 'px)').trim() : base;
  }
  // Altyazı görev satırını örtmez (TV uygulaması 0.9.120 ile aynı): bilgisayar görev satırının karedeki yerini gönderir
  // ("objective" olayı; altyazıda "keep"). Satır (örtüyle birlikte) görev satırının ve yerindeki görev çevirisinin üstüne
  // kayar; "Altında"da İngilizce satırın üstüne geçer. Görev satırı altyazının yerinin ortasından yukarıdaysa kayma olmaz.
  var objectiveBox = null, objectiveShift = 0;

  function clearObjective() {
    objectiveShift = 0;
    wrap.style.transform = '';
    if (!objectiveBox || !line.classList.contains('on')) return;
    if (lastBox && objectiveBox.top < (lastBox.top + lastBox.bottom) / 2) return;
    var sub = line.getBoundingClientRect();
    if (!(sub.width > 0) || !(sub.height > 0)) return;
    var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
    var top = objectiveBox.top * h, row = (objectiveBox.bottom - objectiveBox.top) * h;
    var mission = regions['auto-mission'];
    if (mission) {
      Array.prototype.forEach.call(mission.children.length ? mission.children : [mission], function (el) {
        var r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0 && r.bottom > top && r.top >= top - 2 * row) top = Math.min(top, r.top);
      });
    }
    var limit = top - Math.max(4, Math.round(h * 0.006));
    if (sub.bottom <= limit || sub.right <= objectiveBox.left * w || sub.left >= objectiveBox.right * w) return;
    var dy = limit - sub.bottom;
    if (shownMode === 'below' && lastBox) dy = Math.min(dy, lastBox.top * h - h * 0.024 - sub.bottom);
    if (sub.top + dy < 0) dy = -sub.top;
    if (dy >= 0) return;
    objectiveShift = Math.round(dy);
    wrap.style.transform = 'translate(0px, ' + objectiveShift + 'px)';
  }

  function avoidPhone() {
    wrap.style.transform = objectiveShift ? 'translate(0px, ' + objectiveShift + 'px)' : '';
    var phone = regions['game-phone'];
    if (!phone || !line.classList.contains('on')) return;
    var rect = null;
    Array.prototype.forEach.call(phone.className === 'phone-blocks' ? phone.children : [phone], function (el) {
      var r = el.getBoundingClientRect();
      if (!(r.width > 0) || !(r.height > 0)) return;
      rect = rect ? { left: Math.min(rect.left, r.left), top: Math.min(rect.top, r.top), right: Math.max(rect.right, r.right),
        bottom: Math.max(rect.bottom, r.bottom) } : { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
    });
    var sub = line.getBoundingClientRect();
    if (!rect || !(sub.width > 0) || !(sub.height > 0)) return;
    var w = window.innerWidth || 1920, h = window.innerHeight || 1080, gap = Math.max(4, Math.round(w * 0.01));
    if (sub.right + gap <= rect.left || sub.left - gap >= rect.right || sub.bottom + gap <= rect.top || sub.top - gap >= rect.bottom) return;
    var margin = Math.round(w * 0.02), roomLeft = rect.left - gap - margin, roomRight = w - margin - rect.right - gap;
    var fitsLeft = sub.width <= roomLeft, fitsRight = sub.width <= roomRight, dx = 0, dy = 0;
    if (fitsLeft || fitsRight) {
      dx = fitsLeft && (!fitsRight || roomLeft >= roomRight) ? rect.left - gap - sub.right : rect.right + gap - sub.left;
    } else if (sub.top + rect.top - gap - sub.bottom >= 0) {
      dy = rect.top - gap - sub.bottom;
    } else if (sub.bottom + rect.bottom + gap - sub.top <= h) {
      dy = rect.bottom + gap - sub.top;
    }
    if (dx || dy) wrap.style.transform = 'translate(' + Math.round(dx) + 'px, ' + Math.round(dy + objectiveShift) + 'px)';
  }

  function avoidRegions() {
    var parts = Array.prototype.slice.call(regionsBox.querySelectorAll('.region:not(#phone-region), .phone.auto'));
    parts.forEach(function (el) { shiftBox(el, 0); });
    clearObjective();
    avoidPhone();
    if (!line.classList.contains('on') || !parts.length) return;
    var sub = line.getBoundingClientRect();
    if (!(sub.height > 0)) return;
    var h = window.innerHeight || 1080, gap = Math.max(4, Math.round(h * 0.006));
    parts.forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (!(r.width > 0) || r.right <= sub.left || r.left >= sub.right) return;
      if (r.bottom + gap <= sub.top || r.top - gap >= sub.bottom) return;
      var up = sub.top - gap - r.bottom, down = sub.bottom + gap - r.top;
      var above = (r.top + r.bottom) / 2 < (sub.top + sub.bottom) / 2;
      var dy = above ? up : down;
      if (r.top + dy < 0 || r.bottom + dy > h) dy = above ? down : up;
      shiftBox(el, dy);
    });
  }

  function clearRegions() {
    for (var id in regions) regionsBox.removeChild(regions[id]);
    regions = {};
  }

  // Kalkarken yalnız "on" gider; "cover" ve metin solma bitene kadar yerinde kalır. "cover" gidince opak kutu
  // kapın içinde tam yüksekliğe uzayıp OBS'te kısa süre siyah pencere olarak görünürdü.
  function hide() {
    clearTimeout(timer);
    line.classList.remove('on');
  }

  // Konuşana göre renk: TV uygulamasıyla aynı (tv-webos/app.js speakerSegments); eski uygulama alanı göndermez.
  function speakerMap(list) {
    if (!list || typeof list.length !== 'number') return null;
    var map = null;
    for (var i = 0; i < list.length && i < 16; i++) {
      var item = list[i];
      if (!item || typeof item.name !== 'string' || !item.name || item.name.length > 40) continue;
      if (typeof item.color !== 'string' || !/^#[0-9A-Fa-f]{6}$/.test(item.color)) continue;
      map = map || {};
      map[item.name] = item.color;
    }
    return map;
  }

  // Metnin parçaları: [{text, color}] (renksiz parçada color null). Ad yalnız satır başında aranır ve yalnız "Ad:"
  // boyanır; cümle ve bölünmüş devam satırları kullanıcının yazı renginde kalır (TV 0.9.79; önceden bütün satır
  // boyanıyor, "Yazı rengi" beyazken altyazı renkli görünüyordu).
  // wholeLine (Karakter Adı › "Tüm Satır", style.wholeLine): ad ve cümle, devam satırlarıyla birlikte sonraki konuşanın
  // adına dek o konuşanın renginde (Mac, iPhone, Windows ve Android ile aynı).
  function speakerSegments(text, map, wholeLine) {
    if (!map) return [{ text: text, color: null }];
    var segments = [];
    var start = 0;
    var lineStart = 0;
    var running = null;
    while (lineStart <= text.length) {
      var found = null;
      var end = 0;
      for (var name in map) {
        if (!Object.prototype.hasOwnProperty.call(map, name)) continue;
        if (text.substr(lineStart, name.length) !== name) continue;
        var at = lineStart + name.length;
        if (text.charAt(at) === ' ') at++;
        var after = text.charAt(at);
        if ((after === ':' || after === '\uFF1A') && (!found || name.length > found.length)) {
          found = name;
          end = at + 1;
        }
      }
      if (found) {
        if (lineStart > start) segments.push({ text: text.slice(start, lineStart), color: running });
        if (wholeLine) {
          running = map[found];
          start = lineStart;
        } else {
          segments.push({ text: text.slice(lineStart, end), color: map[found] });
          start = end;
        }
      }
      var next = text.indexOf('\n', lineStart);
      if (next < 0) break;
      lineStart = next + 1;
    }
    if (start < text.length || !segments.length) segments.push({ text: text.slice(start), color: running });
    return segments;
  }

  // Konuşan rengi yalnız adı boyar (style.nameOnly; TV uygulamasıyla aynı).
  var speakerNameOnly = false;
  // Karakter Adı › Tüm Satır (style.wholeLine): cümle de konuşanın renginde. Alanı göndermeyen bilgisayarda yalnız ad.
  var speakerWholeLine = false;

  function paintSpeakers(el, text, map) {
    var segments = speakerSegments(text, map, speakerWholeLine);
    if (segments.length === 1 && !segments[0].color) return;
    el.textContent = '';
    for (var i = 0; i < segments.length; i++) {
      if (!segments[i].color) {
        el.appendChild(document.createTextNode(segments[i].text));
        continue;
      }
      var colored = segments[i].text;
      var rest = '';
      if (speakerNameOnly && !speakerWholeLine) {
        var colon = colored.search(/[:\uFF1A]/);
        if (colon >= 0) {
          rest = colored.slice(colon + 1);
          colored = colored.slice(0, colon + 1);
        }
      }
      var span = document.createElement('span');
      span.className = 'speaker';
      span.style.color = segments[i].color;
      span.textContent = colored;
      el.appendChild(span);
      if (rest) el.appendChild(document.createTextNode(rest));
    }
  }

  function show(text, duration, box, speakers) {
    clearTimeout(timer);
    if (!text) return hide();
    hideHint();
    // Oyundaki altyazının yeri gelmezse son bilinen yer kullanılır (TV ile aynı): "Örtsün"de örtülür, "Üstünde"/"Altında"da
    // çeviri onun üstünde/altında kalır, alttaki İngilizce satırın üstüne inmez.
    if (placement !== 'fixed' && !box) box = lastBox;
    if (box) lastBox = box;
    var covering = box && !fixed.bottom && placement === 'cover' && !(lastStyle && lastStyle.backgroundShape === 'band');
    var wrapped = covering ? coverWrap(text, box) : wrapSubtitle(text);
    textScale = wrapped.scale;
    line.textContent = wrapped.text;
    paintSpeakers(line, wrapped.text, speakerMap(speakers));
    line.style.fontSize = pixels(baseSize * textScale);
    // Çevirinin yeri TV ile aynı: İngilizce satırı örterek (cover), üstünde (above) ya da altında (below);
    // ekranın kenarında yer yoksa öbür yana geçer. Satırın yeri bilinmiyorsa ya da ?bottom verildiyse sabit yükseklik.
    var mode = box && !fixed.bottom ? placement : 'fixed';
    if (mode !== 'cover' && mode !== 'above' && mode !== 'below') mode = 'fixed';
    wrap.style.left = '';
    wrap.style.right = '';
    wrap.style.top = '';
    wrap.style.bottom = '';
    if (mode === 'cover') {
      shownMode = mode;
      // Kutu sayfanın tamamına göre yerleşir: kap tüm sayfayı kaplar.
      wrap.style.top = '0';
      wrap.style.bottom = '0';
      var band = lastStyle && lastStyle.backgroundShape === 'band';
      line.style.left = band ? '50%' : ((box.left + box.right) / 2 * 100) + '%';
      line.style.maxWidth = band ? '100vw' : '';
      line.style.top = ((box.top + box.bottom) / 2 * 100) + '%';
      // Bant: zemin sayfanın tüm genişliğini kaplar (eski sürümler alanı göndermez, yazı kadar kalır). Kutu İngilizce
      // altyazıyı genişlikte ve yükseklikte (iki satırlık altyazı dahil) her yana payla örter; dar kalan kutunun
      // yanlarından ya da altından/üstünden oyunun yazısı görünüyordu. Yazı kutunun dikey ortasında kalır.
      var viewWidth = window.innerWidth || 1920, viewHeight = window.innerHeight || 1080;
      var margin = COVER_MARGIN * viewHeight / 1080;
      line.style.boxSizing = 'border-box';
      line.style.minWidth = band ? '100vw' : Math.ceil((box.right - box.left) * viewWidth + 2 * margin) + 'px';
      line.style.paddingTop = '';
      line.style.paddingBottom = '';
      var coverHeight = (box.bottom - box.top) * viewHeight + 2 * margin;
      line.style.background = coverColor();
      line.className = 'on cover';
      var natural = line.offsetHeight;
      if (natural > 0 && natural < coverHeight) {
        var extra = (coverHeight - natural) / 2, padded = window.getComputedStyle(line);
        line.style.paddingTop = (parseFloat(padded.paddingTop) + extra) + 'px';
        line.style.paddingBottom = (parseFloat(padded.paddingBottom) + extra) + 'px';
      }
      if (!band) {
        // Genişleyen kutu ekranın kenarından taşmasın: ortası kutunun yarısı kadar içeride kalır.
        var pageWidth = window.innerWidth || 1920, half = line.offsetWidth / 2;
        var center = Math.min(Math.max((box.left + box.right) / 2 * pageWidth, half), pageWidth - half);
        line.style.left = (center / pageWidth * 100) + '%';
      }
    } else {
      line.style.left = '';
      line.style.top = '';
      line.style.minWidth = '';
      line.style.maxWidth = '';
      line.style.boxSizing = '';
      line.style.paddingTop = '';
      line.style.paddingBottom = '';
      line.className = 'on';
      apply(lastStyle);
      // "Örtsün" seçili ama satırın yeri hiç bilinmiyor (test yazısı): zemin yine tam opak (TV ile aynı).
      if (placement === 'cover' && !fixed.bottom && !(lastStyle && lastStyle.backgroundShape === 'band')) line.style.background = coverColor();
      // apply() may restore a fixed bottom from the previous subtitle. Pick the new mode first,
      // then position the wrapper without carrying stale vertical coordinates forward.
      wrap.style.top = '';
      wrap.style.bottom = '';
      // Çevirinin kutusu ile İngilizce satır arasında ekran yüksekliğinin %2,4'ü boşluk (TV ile aynı; eskiden %1,2, zemin
      // İngilizce yazıya değiyormuş gibi görünüyordu).
      var gap = 2.4;
      if (mode !== 'fixed') {
        // Kap İngilizce satırın hemen üstüne ya da altına oturur, yatayda satırın ortasına hizalanır.
        var center = (box.left + box.right) / 2;
        var half = Math.max(0.3, Math.min(center, 1 - center));
        wrap.style.left = (Math.max(0.02, center - half) * 100) + '%';
        wrap.style.right = (Math.max(0.02, 1 - center - half) * 100) + '%';
        var viewportHeight = window.innerHeight || 1080;
        var subtitleHeight = line.getBoundingClientRect().height;
        var gapPixels = viewportHeight * gap / 100;
        var fitsAbove = subtitleHeight <= box.top * viewportHeight - gapPixels;
        var fitsBelow = subtitleHeight <= (1 - box.bottom) * viewportHeight - gapPixels;
        if (mode === 'above' && !fitsAbove) mode = fitsBelow ? 'below' : 'fixed';
        else if (mode === 'below' && !fitsBelow) mode = fitsAbove ? 'above' : 'fixed';
      }
      shownMode = mode;
      if (mode === 'above') {
        wrap.style.bottom = ((1 - box.top) * 100 + gap) + '%';
      } else if (mode === 'below') {
        wrap.style.top = (box.bottom * 100 + gap) + '%';
      } else {
        wrap.style.left = '';
        wrap.style.right = '';
        var bottom = Number(fixed.bottom || lastStyle.bottomPercent);
        if (bottom >= 0 && bottom <= 85) wrap.style.bottom = bottom + '%';
      }
    }
    avoidRegions();
    timer = setTimeout(hide, Math.max(1000, duration || 8000));
  }

  apply({});
  window.addEventListener('resize', function () { apply(lastStyle); });
  showHint(TEXTS.waiting, 12);
  // "obs" parametresi uygulamaya bunun TV olmadığını söyler; "TV bağlı" sayısına katılmaz.
  // Sayfa herkese açık bir kabuktur; anahtar yalnız kullanıcının verdiği URL'den gelir.
  var key = new URLSearchParams(window.location.search).get('k');
  var events = new EventSource('/events?viewer=obs' + (key !== null ? '&k=' + encodeURIComponent(key) : ''));
  var everOpen = false;
  events.onopen = function () { everOpen = true; };
  events.onerror = function () { if (!everOpen) showHint(TEXTS.offline, 12); };
  events.addEventListener('style', function (e) { try { apply(JSON.parse(e.data)); } catch (err) {} });
  events.addEventListener('subtitle', function (e) {
    try {
      var d = JSON.parse(e.data);
      if (d.paragraphs !== true) objectiveBox = validBox(d.keep);
      show(d.text, d.duration, d.box, d.speakerNames || d.speakers);
    } catch (err) {}
  });
  events.addEventListener('objective', function (e) {
    try { objectiveBox = validBox(JSON.parse(e.data).box); avoidRegions(); } catch (err) {}
  });
  events.addEventListener('clear', hide);
  // Sürekli okunan ek alanlar (Ayarlar > Altyazı alanı > Alan 1-3 > "Sürekli oku").
  events.addEventListener('region', function (e) {
    try { var d = JSON.parse(e.data); showRegion(d.id, d.text, d.box, d.blocks); } catch (err) {}
  });
  events.addEventListener('region-clear', clearRegions);
})();
</script>
</body>
</html>
